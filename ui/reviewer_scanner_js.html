        console.error('[DEBUG_QR] Nome do erro:', error.name);
        console.error('[DEBUG_QR] Mensagem:', error.message);
        throw error;
      }

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const statsCanvas = document.createElement('canvas');
      statsCanvas.width = 64;
      statsCanvas.height = 64;
      const statsCtx = statsCanvas.getContext('2d', { willReadFrequently: true });
      scanStartTs = performance.now();

      // Mantem dimensao de processamento fixa para evitar realocacao de buffer a cada frame.
      const initialSourceW = Math.max(1, video.videoWidth || 1280);
      const initialSourceH = Math.max(1, video.videoHeight || 720);
      const maxProcessDim = useBasicFastProfile
        ? (ultraLowEndByMemory ? 640 : 720)
        : (lowEndByMemory ? 720 : 960);
      const processScale = Math.min(1, maxProcessDim / Math.max(initialSourceW, initialSourceH, 1));
      canvas.width = Math.max(320, Math.floor(initialSourceW * processScale));
      canvas.height = Math.max(240, Math.floor(initialSourceH * processScale));
      ctx.imageSmoothingEnabled = false;

      interval = setInterval(() => {
        if (settled) return;
        if (scanPaused) return;
        if (scanLoopBusy) return;
        if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
        scanLoopBusy = true;
        setScannerUiState('busy', 'Processando frame');

        try {
        const frameStart = performance.now();
        frameTick++;

        // ✅ REFOCO PERIÓDICO MAIS FREQUENTE para QR pequeno (120 → 60 frames)
        // Força refoco a cada ~1.5 segundos para manter foco em QR 1x1
        if (!isIOSDevice && !hasContinuousFocus && activeTrack && frameTick > 40 && (frameTick - lastRefocusTick) >= 60) {
          const focusCaps = activeTrack.getCapabilities?.();
          const focusModes = focusCaps?.focusMode;
          if (Array.isArray(focusModes) && focusModes.includes('single-shot')) {
            console.log('[DEBUG_QR] 🔔 Refoco periódico acionado (frame:', frameTick, ')');
            activeTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] })
              .then(() => {
                console.log('[DEBUG_QR] ✅ Refoco periódico concluído');
              })
              .catch((err) => {
                console.warn('[DEBUG_QR] ⚠️ Refoco periódico falhou:', err?.message);
              });
            lastRefocusTick = frameTick;
          }
        }
        
        // ✅ REFOCO INTELIGENTE MAIS FREQUENTE quando QR detectado mas não lido
        if (!isIOSDevice && !hasContinuousFocus && activeTrack && lastCodeData && stableCount > 3 && (frameTick - lastRefocusTick) >= 40) {
          const focusCaps = activeTrack.getCapabilities?.();
          const focusModes = focusCaps?.focusMode;
          if (Array.isArray(focusModes) && focusModes.includes('single-shot')) {
            console.log('[DEBUG_QR] 🔔 Refoco inteligente acionado (QR detectado mas não lido)');
            activeTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] })
              .then(() => {
                console.log('[DEBUG_QR] ✅ Refoco inteligente concluído');
              })
              .catch((err) => {
                console.warn('[DEBUG_QR] ⚠️ Refoco inteligente falhou:', err?.message);
              });
            lastRefocusTick = frameTick;
          }
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // ✅ DETECÇÃO DE BRIGHTNESS para Galaxy A23 e câmeras ruins
        if (frameTick % 5 === 0) {
          try {
            const smallImageData = statsCtx.getImageData(0, 0, statsCanvas.width, statsCanvas.height);
            const brightness = detectBrightness(smallImageData);
            
            // Mostrar aviso se cena muito escura
            if (isDarkScene && !brightnessWarningShown && frameTick < 120) {
              console.warn('[DEBUG_QR] 🌙 AVISO: Cena muito escura (avg:', Math.round(brightness.trend), ') - ative Flash!');
              brightnessWarningShown = true;
            }
          } catch (err) {
            console.debug('[DEBUG_QR] Brightness detection skip');
          }
        }
        
        // ✅ AUTO-EXPOSIÇÃO para Galaxy A23 em cenas escuras
        if (frameTick % 8 === 0 && isGalaxyA23 && isDarkScene) {
          applyAutoExposure(true);
        }
        
        // ✅ Mostrar indicador visual de brightness baixo
        if (isDarkScene && frameTick % 20 === 0) {
          distanceIndicator.style.opacity = '1';
          distanceIcon.textContent = '🌙';
          distanceLabel.textContent = 'Luz baixa - use Flash ou aproxime de luz';
          distanceLabel.style.background = 'rgba(59,130,246,0.8)';
        }

        // ✅ MODO AGRESSIVO PARA GALAXY A23 E CÂMERAS RUINS
        // Ativa processamento pesado mais cedo
        const dirtyStartFrame = isGalaxyA23 ? 12 : (useBasicFastProfile ? 18 : (isAndroidDevice ? 10 : 12));
        const turboDirtyFrame = isGalaxyA23 ? 20 : (useBasicFastProfile ? 40 : (isAndroidDevice ? 24 : 28));
        const isDirtyMode = frameTick > dirtyStartFrame;
        const isTurboDirtyMode = frameTick > turboDirtyFrame;

        const heavyStep = useBasicFastProfile
          ? (isTurboDirtyMode ? 3 : 6)
          : (isTurboDirtyMode ? 2 : (isIOSDevice ? 5 : 4));
        const shouldRunHeavy = frameTick <= 2 || frameTick % heavyStep === 0 || isTurboDirtyMode;

        // 1) Tentativa nativa (Chrome/Android) - melhora taxa de leitura no S23
        // No perfil básico Android, prioriza detector nativo para menor latência.
        const useBarcodeDetector = detector && !detectorBusy;
        const nativeStep = useBasicFastProfile ? (lowEndByMemory ? 2 : 1) : (isAndroidDevice ? 1 : 2);
        
        if (useBarcodeDetector && (frameTick % nativeStep === 0)) {
          detectorBusy = true;
          createImageBitmap(canvas)
            .then(bitmap => detector.detect(bitmap).finally(() => bitmap.close()))
            .then(results => {
              const first = Array.isArray(results) ? results[0] : null;
              const rawValue = first?.rawValue;
              if (rawValue) {
                ScanTelemetry.nativeDetections++;
                lastDetectionSource = 'native:barcodedetector';
                console.log('[DEBUG_QR] 📱 BarcodeDetector nativo detectou:', rawValue.substring(0, 30) + '...');
                markDetected(rawValue, '✅ QR detectado (modo nativo) — aguarde...');
              }
            })
            .catch(() => {})
            .finally(() => {
              detectorBusy = false;
            });
        }

        // 2) Caminho rápido (baixa latência) antes do pipeline pesado.

        const statsStep = useBasicFastProfile ? 3 : 2;
        if (statsCtx && (frameTick % statsStep === 0 || !lastAdaptiveContext)) {
          statsCtx.drawImage(canvas, 0, 0, statsCanvas.width, statsCanvas.height);
          const statsImageData = statsCtx.getImageData(0, 0, statsCanvas.width, statsCanvas.height);
          lastAdaptiveContext = buildAdaptiveContext(statsImageData, isDirtyMode);
        }

        const adaptiveCtx = lastAdaptiveContext;
        let decodeResult = decodeRoi(ctx, canvas.width, canvas.height, adaptiveCtx, false, true);
        let code = decodeResult?.code || null;
        let sx = decodeResult?.sx || 0;
        let sy = decodeResult?.sy || 0;
        let scanSize = decodeResult?.size || Math.min(canvas.width, canvas.height) * 0.8;

        const canRunHeavy = (performance.now() - frameStart) < frameBudgetMs;
        if (!code && shouldRunHeavy && canRunHeavy) {
          decodeResult = decodeRoi(ctx, canvas.width, canvas.height, adaptiveCtx, isDirtyMode, false) || decodeMultiPass(ctx, canvas.width, canvas.height, isDirtyMode, adaptiveCtx, false);
          code = decodeResult?.code || null;
          sx = decodeResult?.sx || 0;
          sy = decodeResult?.sy || 0;
          scanSize = decodeResult?.size || Math.min(canvas.width, canvas.height) * 0.8;
        }

        // Fallback full-frame (importante para QR fora do centro, comum em S23)
        const canRunFullFrame = (performance.now() - frameStart) < (frameBudgetMs * 1.35);
        if (!code && shouldRunHeavy && canRunFullFrame && frameTick > (useBasicFastProfile ? 26 : 10) && frameTick % (useBasicFastProfile ? 6 : 3) === 0) {
          // Log de qualidade de imagem
          if (frameTick % 15 === 0) {
            const stats = adaptiveCtx || lastAdaptiveContext;
            if (stats) {
              console.log('[DEBUG_QR] 📊 Qualidade da imagem:', {
                avg: Math.round(stats.avg),
                contrast: Math.round(stats.contrast),
                stdDev: Math.round(stats.stdDev),
                lowContrast: stats.lowContrast,
                darkScene: stats.darkScene,
                brightScene: stats.brightScene,
                zoom: currentZoomLevel?.toFixed(2) || 'N/A'
              });
            }
          }
          try {
            const fullImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const fullDecoded = decodeWithVariants(fullImage, isDirtyMode, adaptiveCtx);
            if (fullDecoded) {
              code = fullDecoded;
              sx = 0;
              sy = 0;
              scanSize = Math.min(canvas.width, canvas.height);
              if (!code.location) {
                const estimatedSize = Math.min(canvas.width, canvas.height) * 0.32;
                code.location = {
                  topLeftCorner: { x: (canvas.width - estimatedSize) / 2, y: (canvas.height - estimatedSize) / 2 },
                  topRightCorner: { x: (canvas.width + estimatedSize) / 2, y: (canvas.height - estimatedSize) / 2 },
                  bottomLeftCorner: { x: (canvas.width - estimatedSize) / 2, y: (canvas.height + estimatedSize) / 2 },
                  bottomRightCorner: { x: (canvas.width + estimatedSize) / 2, y: (canvas.height + estimatedSize) / 2 }
                };
              }
            }
          } catch (e) {}
        }

        if (code?.__strategy) {
          lastDetectionSource = code.__strategy;
        }

        if (code?.data) {
          const currentDecoded = String(code.data || '').trim();
          if (currentDecoded && currentDecoded === lastDecodedData) {
            decodedStableCount += 1;
          } else {
            lastDecodedData = currentDecoded;
            decodedStableCount = 1;
          }

          const allowFastFinish = currentDecoded.length >= 8 && (
            isIOSDevice ||
            isDirtyMode ||
            frameTick > (useBasicFastProfile ? 8 : 14)
          );

          if (allowFastFinish && decodedStableCount >= 1) {
            console.log('[DEBUG_QR] ✅ Fast-finish por decode válido:', currentDecoded.substring(0, 30) + '...');
            finishWithCode(currentDecoded);
            return;
          }
        }

           // 3) ZXING (fallback pesado) com cadência controlada
           // ✅ OTIMIZADO PARA GALAXY A23: começa mais cedo, tenta com mais frequência
           const zxingStartFrame = isGalaxyA23 ? 4 : ((isIOSDevice) ? 8 : (useBasicFastProfile ? 42 : 10));
           const zxingInterval = isGalaxyA23 
             ? (isDirtyMode ? 2 : 3)  // Galaxy A23: tenta a cada 2-3 frames em modo dirty
             : ((isIOSDevice) ? 4 : (isDirtyMode ? (useBasicFastProfile ? 10 : 3) : (useBasicFastProfile ? 12 : 6)));
           const shouldTryZXing = !code && typeof ZXing !== 'undefined' && ZXing.QRCodeReader &&
             frameTick > zxingStartFrame &&
             frameTick % zxingInterval === 0 &&
             (performance.now() - frameStart) < (frameBudgetMs * 1.15);
        
        if (shouldTryZXing) {
          try {
            // ✅ Canvas redimensionada para ~640×480 (otimização de performance)
            const scaleFactor = Math.max(0.3, Math.min(1, 480 / Math.max(canvas.height, 1)));
            const resizedCanvas = document.createElement('canvas');
            resizedCanvas.width = Math.floor(canvas.width * scaleFactor);
            resizedCanvas.height = Math.floor(canvas.height * scaleFactor);
            const resCtx = resizedCanvas.getContext('2d', { willReadFrequently: true });
            resCtx.drawImage(canvas, 0, 0, resizedCanvas.width, resizedCanvas.height);
            
            const imageData = resCtx.getImageData(0, 0, resizedCanvas.width, resizedCanvas.height);
            const width = resizedCanvas.width;
            const height = resizedCanvas.height;
            
            // ✅ Variantes baseadas no modo (limpo vs sujo)
            let zxingVariants = [];
            
            if (!isDirtyMode) {
              // Modo limpo: variantes básicas
              const contrast = toGrayscaleHighContrast(imageData);
              const binary = toAdaptiveBinary(imageData, adaptiveCtx);
              zxingVariants = [
                { data: imageData.data, name: 'original' },
                { data: contrast, name: 'contrast' },
                { data: binary, name: 'binary' }
              ];
            } else {
              // 🏭 Modo sujo: ESTRATÉGIAS AGRESSIVAS
              console.log('[DEBUG_QR] 🔥 ZXing em modo AGRESSIVO para QR sujo' + (isGalaxyA23 ? ' [Galaxy A23]' : ''));
              const equalized = equalizeHistogram(imageData);
              const aggressive = toAggressiveBinary(imageData, adaptiveCtx);
              const contrast = toGrayscaleHighContrast(imageData);
              const denoised = denoiseImage(imageData);
              const sharpened = sharpenImage(imageData);
              
              // ✅ GALAXY A23: Mais variantes agressivas para câmeras ruins
              if (isGalaxyA23) {
                const aggressiveBinaryDenoised = toAggressiveBinary({ data: denoised, width: imageData.width, height: imageData.height }, adaptiveCtx);
                const aggressiveBinarySharpened = toAggressiveBinary({ data: sharpened, width: imageData.width, height: imageData.height }, adaptiveCtx);
                zxingVariants = [
                  { data: aggressive, name: 'aggressive-binary' },
                  { data: equalized, name: 'equalized' },
                  { data: aggressiveBinaryDenoised, name: 'aggressive-denoised' },
                  { data: aggressiveBinarySharpened, name: 'aggressive-sharpened' },
                  { data: contrast, name: 'contrast' },
                  { data: imageData.data, name: 'original' },
                  { data: denoised, name: 'denoised' },
                  { data: sharpened, name: 'sharpened' }
                ];
              } else {
                // Estratégias reduzidas no início do modo sujo para menor latência
                zxingVariants = [
                  { data: equalized, name: 'equalized' },
                  { data: aggressive, name: 'aggressive-binary' },
                  { data: contrast, name: 'contrast' },
                  { data: imageData.data, name: 'original' }
                ];
              }
            }
            const binarizers = frameTick > 24
              ? [
                  { name: 'Hybrid', create: (src) => new ZXing.HybridBinarizer(src) },
                  { name: 'GlobalHistogram', create: (src) => new ZXing.GlobalHistogramBinarizer(src) }
                ]
              : [
                  { name: 'Hybrid', create: (src) => new ZXing.HybridBinarizer(src) }
                ];

            // ✅ GALAXY A23: Tenta mais binarizers em paralelo
            const effectiveVariants = isDirtyMode && frameTick <= 24 && !isGalaxyA23
              ? zxingVariants.slice(0, 3)
              : zxingVariants;

            for (const variant of effectiveVariants) {
              try {
                const uint8Array = new Uint8ClampedArray(variant.data);
                const luminances = new Uint8ClampedArray(width * height);
                ScanTelemetry.addAttempt('zxing', variant.name);

                for (let i = 0, j = 0; i < uint8Array.length; i += 4, j++) {
                  const r = uint8Array[i];
                  const g = uint8Array[i + 1];
                  const b = uint8Array[i + 2];
                  luminances[j] = Math.floor(0.299 * r + 0.587 * g + 0.114 * b);
                }

                for (const binarizer of binarizers) {
                  try {
                    const luminanceSource = new ZXing.RGBLuminanceSource(luminances, width, height);
                    const binaryBitmap = new ZXing.BinaryBitmap(binarizer.create(luminanceSource));
                    const reader = new ZXing.QRCodeReader();
                    const zxingResult = reader.decode(binaryBitmap);

                    if (zxingResult?.text) {
                      ScanTelemetry.addSuccess('zxing', variant.name);
                      console.log(`[DEBUG_QR] ✅ ZXing ${binarizer.name} leu com: ${variant.name}`);
                      const estimatedSize = Math.min(width, height) * 0.3;
                      const estimatedX = Math.max(0, (width - estimatedSize) / 2);
                      const estimatedY = Math.max(0, (height - estimatedSize) / 2);

                      code = {
                        data: zxingResult.text,
                        __strategy: `zxing:${variant.name}:${binarizer.name}`,
                        location: {
                          topLeftCorner: { x: estimatedX, y: estimatedY },
                          topRightCorner: { x: estimatedX + estimatedSize, y: estimatedY },
                          bottomLeftCorner: { x: estimatedX, y: estimatedY + estimatedSize },
                          bottomRightCorner: { x: estimatedX + estimatedSize, y: estimatedY + estimatedSize }
                        }
                      };
                      sx = 0;
                      sy = 0;
                      scanSize = estimatedSize;
                      break;
                    }
                  } catch {}
                }

                if (code) break;
              } catch (variantError) {
                continue;
              }
            }
            
          } catch (zxingError) {
            // ZXing falhou, continua silenciosamente
            if (frameTick % 30 === 0) {
              console.debug('[DEBUG_QR] ZXing: todas as estratégias falharam');
            }
          }
        } else if (!code && frameTick === 15 && typeof ZXing === 'undefined') {
          console.warn('[DEBUG_QR] ⚠️ ZXing não disponível - apenas jsQR + BarcodeDetector em uso');
          console.warn('[DEBUG_QR] ⚠️ Isso pode causar problemas em iPhone/S23 - verifique CSP');
        }

        if (code) {
          if (code.__strategy) {
            lastDetectionSource = code.__strategy;
          }
          console.log('[DEBUG_QR] 📸 Frame', frameTick, '- Código detectado:', code.data.substring(0, 30) + '...');
          
          const target = {
            x: (scanSize - frameSize) / 2,
            y: (scanSize - frameSize) / 2,
            size: frameSize
          };

          const shiftedLocation = {
            topLeftCorner: { x: code.location.topLeftCorner.x - sx, y: code.location.topLeftCorner.y - sy },
            topRightCorner: { x: code.location.topRightCorner.x - sx, y: code.location.topRightCorner.y - sy },
            bottomLeftCorner: { x: code.location.bottomLeftCorner.x - sx, y: code.location.bottomLeftCorner.y - sy },
            bottomRightCorner: { x: code.location.bottomRightCorner.x - sx, y: code.location.bottomRightCorner.y - sy }
          };

          const strictInside = isInsideTarget(shiftedLocation, target);
          const centeredEnough = isCenteredEnough(shiftedLocation, target, 100);
          
          // ✅ Calcular tamanho estimado do QR para detectar distância
          const qrWidth = code.location.topRightCorner.x - code.location.topLeftCorner.x;
          const tooClose = qrWidth > frameSize * 0.92; // QR muito grande = muito perto
          const tooFar = qrWidth < frameSize * 0.28;   // QR muito pequeno = muito longe
          const idealSize = frameSize * 0.65; // Tamanho ideal (65% da moldura)
          const sizeRatio = qrWidth / frameSize;

          // ✅ Zoom dinâmico automático - AUMENTADO para QR pequeno
          if (autoZoomEnabled && caps?.zoom && (frameTick - lastAutoZoomTick) > zoomCooldown) {
            const zoomRange = maxZoomLevel - minZoomLevel;
            let targetZoom = currentZoomLevel;
            
            // ✅ LIMITES OTIMIZADOS para QR 1x1
            // tooFar: QR < 24% do tamanho (antes era 28%)
            // tooClose: QR > 92% do tamanho (antes era 92%)
            const revisedTooFar = qrWidth < frameSize * 0.22;
            const revisedTooClose = qrWidth > frameSize * 0.90;
            
            if (revisedTooFar && currentZoomLevel < maxZoomLevel) {
              // Aproximar: aumentar zoom MAIS AGRESSIVAMENTE (30% em vez de 15%)
              targetZoom = Math.min(maxZoomLevel, currentZoomLevel + (zoomRange * 0.30));
              console.log('[DEBUG_QR] 🔔 Zoom IN AGRESSIVO - QR muito longe:', {
                current: currentZoomLevel.toFixed(2),
                target: targetZoom.toFixed(2),
                sizeRatio: sizeRatio.toFixed(2),
                qrWidth: Math.round(qrWidth),
                frameSize: Math.round(frameSize)
              });
            } else if (revisedTooClose && currentZoomLevel > minZoomLevel) {
              // Afastar: diminuir zoom MAIS AGRESSIVAMENTE
              targetZoom = Math.max(minZoomLevel, currentZoomLevel - (zoomRange * 0.30));
              console.log('[DEBUG_QR] 🔔 Zoom OUT AGRESSIVO - QR muito perto:', {
                current: currentZoomLevel.toFixed(2),
                target: targetZoom.toFixed(2),
                sizeRatio: sizeRatio.toFixed(2),
                qrWidth: Math.round(qrWidth),
                frameSize: Math.round(frameSize)
              });
            } else if (Math.abs(sizeRatio - 0.65) > 0.18) {
              // Ajuste fino para tamanho ideal - MAIS SENSÍVEL (0.15 → 0.18)
              const zoomAdjust = (0.65 - sizeRatio) * (zoomRange * 0.40);
              targetZoom = Math.max(minZoomLevel, Math.min(maxZoomLevel, currentZoomLevel + zoomAdjust));
              console.log('[DEBUG_QR] 🔔 Zoom FINE - Ajuste fino:', {
                current: currentZoomLevel.toFixed(2),
                target: targetZoom.toFixed(2),
                sizeRatio: sizeRatio.toFixed(2)
              });
            }
            
            if (targetZoom !== currentZoomLevel) {
              try {
                activeTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
                currentZoomLevel = targetZoom;
                lastAutoZoomTick = frameTick;
              } catch (zoomErr) {
                console.warn('[DEBUG_QR] ⚠️ Falha ao ajustar zoom:', zoomErr?.message);
              }
            }
          }
          
          // ✅ Moldura adaptativa
          if (!tooClose && !tooFar) {
            targetFrameSize = Math.max(200, Math.min(350, qrWidth * 1.4));
            if (Math.abs(targetFrameSize - frameShowSize) > 20) {
              frameShowSize = targetFrameSize;
              frame.style.width = frameShowSize + 'px';
              frame.style.height = frameShowSize + 'px';
            }
          }
          
          // ✅ Detectar se câmera está parada ou movendo (baseado em variação de tamanho)
          const sizeChange = Math.abs(qrWidth - lastQRSize) / Math.max(lastQRSize, 1);
          const isMoving = sizeChange > 0.05; // Mudança >5% = movimento
          lastQRSize = qrWidth;
          
          // ✅ Indicador de distância
          if (tooClose) {
            distanceIndicator.style.opacity = '1';
            distanceIcon.textContent = '🔴';
            distanceLabel.textContent = 'Muito perto - afaste';
            distanceLabel.style.background = 'rgba(239,68,68,0.8)';
          } else if (tooFar) {
            distanceIndicator.style.opacity = '1';
            distanceIcon.textContent = '🔵';
            distanceLabel.textContent = 'Muito longe - aproxime';
            distanceLabel.style.background = 'rgba(59,130,246,0.8)';
          } else {
            distanceIndicator.style.opacity = '0';
          }

          if (strictInside || centeredEnough) {
            console.log('[DEBUG_QR] ✅ QR bem posicionado - chamando markDetected()');
            console.log('[DEBUG_QR] 📊 Estado final:', {
              sizeRatio: sizeRatio.toFixed(2),
              zoom: currentZoomLevel?.toFixed(2) || 'N/A',
              frameSize: frameShowSize,
              isMoving,
              frameTick
            });
            updateTargetVisual('valid');
            updateFeedback({
              detected: true,
              wellPositioned: true,
              tooFar: false,
              tooClose: false,
              isStable: !isMoving,
              timeRemaining: 0
            });
            distanceIndicator.style.opacity = '0';
            markDetected(code.data, 'Posição ideal, confirmando leitura...');
            setScannerUiState('busy', 'QR detectado, validando');
          } else {
            // QR detectado mas fora de posição
            const sameCode = code.data === lastCodeData;
            stableCount = sameCode ? stableCount + 1 : 1;
            lastCodeData = code.data;

            updateTargetVisual('processing');
            scanLine.style.animationPlayState = 'running';
            const remaining = Math.max(0, 5 - Math.floor(frameTick / 10));
            statusText.textContent = 'QR detectado — ajuste o enquadramento (' + remaining + 's)';
            
            // Determinar qualidade do QR baseado em tentativas
            let quality = 'Boa';
            if (frameTick > 30) quality = 'Ruim (sujo?)';
            else if (frameTick > 15) quality = 'Média';
            
            // Atualizar feedback - detectado mas desalinhado
            updateFeedback({
              detected: true,
              wellPositioned: false,
              tooFar: tooFar,
              tooClose: tooClose,
              isStable: !isMoving && sameCode && stableCount > 2,
              timeRemaining: remaining
            });
            
            console.log('[DEBUG_QR] 🟡 QR fora de posição ideal | stableCount:', stableCount, '| frameTick:', frameTick);

            if (stableCount >= 2 && frameTick > 20) {
              console.log('[DEBUG_QR] ✅ Aceitar QR fora de posição após', frameTick, 'frames (~', (frameTick * 100 / 1000).toFixed(1), 's)');
              finishWithCode(code.data);
            } else if (frameTick > 40) {
              console.log('[DEBUG_QR] ✅ Timeout absoluto - aceitando QR após', frameTick, 'frames (4 segundos)');
              finishWithCode(code.data);
            }
          }
        } else {
          // Resetar contadores se nenhum código detectado
          if (lastCodeData !== '') {
            console.log('[DEBUG_QR] 🔄 QR perdido - resetando contadores');
          }
          stableCount = 0;
          lastCodeData = '';
          decodedStableCount = 0;
          updateTargetVisual('idle');
          scanLine.style.animationPlayState = 'running';
          statusText.textContent = 'Alinhe o QR dentro da moldura';
          distanceIndicator.style.opacity = '0';
          
          // Resetar moldura para tamanho padrão
          if (frameShowSize !== 280) {
            frameShowSize = 280;
            frame.style.width = '280px';
            frame.style.height = '280px';
          }
          
          // Atualizar feedback - não detectado
          const remaining = Math.max(0, 2 - Math.floor(frameTick / 20));
          updateFeedback({
            detected: false,
            wellPositioned: false,
            tooFar: false,
            tooClose: false,
            isStable:false,
            timeRemaining: remaining
          });

          // Resetar zoom para mínimo após perder QR
          if (autoZoomEnabled && caps?.zoom && currentZoomLevel > minZoomLevel && frameTick % 60 === 0) {
            try {
              activeTrack.applyConstraints({ advanced: [{ zoom: minZoomLevel }] });
              currentZoomLevel = minZoomLevel;
              console.log('[DEBUG_QR] 🔔 Zoom resetado para mínimo (QR perdido)');
            } catch (zoomErr) {
              console.warn('[DEBUG_QR] ⚠️ Falha ao resetar zoom:', zoomErr?.message);
            }
          }

          const elapsedMs = performance.now() - scanStartTs;
          const autoCaptureMs = useBasicFastProfile ? (isGalaxyA23 ? 1800 : 2300) : 3600;
          const autoCaptureFrame = useBasicFastProfile ? (isGalaxyA23 ? 18 : 24) : 36;
          if (!autoStaticTriggered && ((useBasicFastProfile && elapsedMs >= autoCaptureMs) || (!useBasicFastProfile && isDirtyMode && frameTick >= autoCaptureFrame))) {
            autoStaticTriggered = true;
            console.warn('[DEBUG_QR] ⚠️ Auto fallback: captura estática acionada por demora na leitura');
            handleStaticCapture().catch(() => {
              autoStaticTriggered = false;
            });
          }

          setScannerUiState('active', 'Scanner ativo');
        }
        } finally {
          scanLoopBusy = false;
          if (!settled && !scanPaused) {
            setScannerUiState('active', 'Scanner ativo');
          }
        }
      }, scanLoopIntervalMs);
    }

    // 🔍 Detectar ambiente Apps Script
    const isAppsScript = window.location.hostname.includes('script.google') || 
                         window.location.hostname.includes('googleusercontent.com');
    
    if (isAppsScript) {
      console.log('[DEBUG_QR] 🏢 Ambiente Apps Script detectado - ajustando timeouts');
    }

    async function loadScriptWithFallback(urls, timeoutMs, name) {
      let lastError = null;

      for (const src of urls) {
        try {
          await new Promise((res, rej) => {
            const timeout = setTimeout(() => {
              rej(new Error(`Timeout carregando ${name} via ${src}`));
            }, timeoutMs);

            const s = document.createElement('script');
            s.src = src;
            s.crossOrigin = 'anonymous';
            s.onload = () => {
              clearTimeout(timeout);
              res();
            };
            s.onerror = (e) => {
              clearTimeout(timeout);
              rej(e || new Error(`Falha carregando ${name} via ${src}`));
            };
            document.head.appendChild(s);
          });

          console.log(`[DEBUG_QR] ✅ ${name} carregado por: ${src}`);
          return;
        } catch (err) {
          lastError = err;
          console.warn(`[DEBUG_QR] ⚠️ ${name} falhou em: ${src}`);
        }
      }

      throw (lastError || new Error(`Falha ao carregar ${name}`));
    }

    // Carregamento sequencial de bibliotecas com timeout e retry
    const loadLibraries = async () => {
      // 1. Carregar jsQR (leve e rápido) - OBRIGATÓRIO
      if (typeof jsQR === 'undefined') {
        console.log('[DEBUG_QR] 📦 Carregando jsQR...');
        try {
          await loadScriptWithFallback(
            [
              'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js',
              'https://unpkg.com/jsqr@1.4.0/dist/jsQR.min.js'
            ],
            isAppsScript ? 15000 : 10000,
            'jsQR'
          );
          console.log('[DEBUG_QR] ✅ jsQR carregado com sucesso');
        } catch (jsqrErr) {
          console.error('[DEBUG_QR] ❌ jsQR não carregou:', jsqrErr?.message || jsqrErr);
          console.warn('[DEBUG_QR] ⚠️ jsQR falhou - tentando continuar com BarcodeDetector nativo se disponível');
        }
      } else {
        console.log('[DEBUG_QR] ✅ jsQR já carregado');
      }

      // 2. Carregar ZXing - FORÇAR CARREGAMENTO MESMO EM PERFIL BÁSICO
      // Isso é crítico para iPhone e Samsung S23
      if (typeof ZXing === 'undefined') {
        console.log('[DEBUG_QR] 📦 Carregando ZXing (detecção robusta para QR contaminados)...');
        try {
          await loadScriptWithFallback(
            [
              'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js',
              'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js'
            ],
            isAppsScript ? 20000 : 12000,
            'ZXing'
          );

          if (typeof ZXing !== 'undefined' && ZXing.QRCodeReader) {
            console.log('[DEBUG_QR] ✅ ZXing.QRCodeReader confirmado');
          } else {
            console.warn('[DEBUG_QR] ⚠️ ZXing carregou mas QRCodeReader não disponível');
          }
        } catch (e) {
          console.warn('[DEBUG_QR] ⚠️ ZXing não disponível (Apps Script pode ter bloqueado):', e?.message);
          console.log('[DEBUG_QR] ℹ️ Sistema continuará com jsQR + BarcodeDetector nativo');
        }
      } else {
        console.log('[DEBUG_QR] ✅ ZXing já carregado');
      }

      // Sumário de bibliotecas disponíveis
      const available = [];
      if (typeof jsQR !== 'undefined') available.push('jsQR');
      if (typeof ZXing !== 'undefined' && ZXing.QRCodeReader) available.push('ZXing');
      if ('BarcodeDetector' in window) available.push('BarcodeDetector');
      
      console.log('[DEBUG_QR] 📚 Bibliotecas disponíveis:', available.join(', ') || 'NENHUMA (fallback nativo apenas)');
      
      if (available.length === 0) {
        console.warn('[DEBUG_QR] ⚠️ Nenhuma biblioteca QR externa disponível; prosseguindo com câmera nativa e fallback estático.');
      }

      await start();
    };

    loadLibraries().catch(e => {
      console.error('[DEBUG_QR] ❌ Erro crítico ao carregar bibliotecas:', e);
      console.error('[DEBUG_QR] 🔍 Verifique:', [
        '1. Conexão com internet',
        '2. Política CSP do Apps Script',
        '3. Console do navegador para erros CORS',
        '4. Se está em ambiente Apps Script, pode haver restrições'
      ].join('\n'));
      reject(e);
    });

  });
  
  // Usar Promise.race para enforce timeout
  return Promise.race([timeoutPromise, scanPromise]);
}

/**
 * =========================================================================
 * FUNÇÃO GLOBAL: handleQrScanResult
 * =========================================================================
 * Callback global usado pelo scanner para processar dados de QR lidos.
 * Pode ser substituída pelo App para integração customizada.
 */
window.handleQrScanResult = function(qrData) {
  console.log('[QR_GLOBAL] 📡 handleQrScanResult chamada com dados:', qrData.substring(0, 50) + '...');
  
  // Se o App está carregado, delega para ele
  if (typeof App !== 'undefined' && App.handleQrScanResult) {
    return App.handleQrScanResult(qrData);
  }
  
  // Fallback: tenta armazenar para uso posterior
  if (typeof window !== 'undefined') {
    window._lastQrData = qrData;
    console.log('[QR_GLOBAL] 💾 QR data armazenada em window._lastQrData');
  }
  //teste
};

</script>
