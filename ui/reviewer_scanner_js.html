const ultraLowEndByMemory = deviceMemory <= 3;

  console.log('[DEBUG_QR] ⚠️ Galaxy A23 detectado — forçando modo de scan de maior qualidade');

        showToast: function(msg, color) {
            console.log(`[UI_TOAST Fallback] ${msg} (${color})`);
        }
    };
}

// Alterado o nome da constante para evitar conflito com o escopo global
const currentApiUrl = window.APP_BASE_URL || window.__APP_URL__ || '';

function isIOSDevice() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function isAndroidDevice() {
  return /Android/i.test(navigator.userAgent);
}

function pickPreferredRearCamera(devices) {
  if (!Array.isArray(devices)) return null;
  const rearDevices = devices.filter(device => device.kind === 'videoinput' && /rear|back|environment/i.test(device.label));
  if (rearDevices.length) {
    return rearDevices[0];
  }
  return devices.find(device => device.kind === 'videoinput') || null;
}

// 2. Variáveis globais - Scanner industrial (v2) definido abaixo
// 11.6. QR CODE SCANNER COM CÂMERA (VERSÃO INDUSTRIAL)
// =========================================================================

const QR_TELEMETRY_SESSION_KEY = 'rrt_qr_scan_telemetry_v1';

const QrTelemetrySession = {
  _cache: null,

  _blank() {
    return {
      totalScans: 0,
      acceptedSources: Object.create(null),
      jsqrAttempts: Object.create(null),
      jsqrSuccess: Object.create(null),
      zxingAttempts: Object.create(null),
      zxingSuccess: Object.create(null),
      nativeDetections: 0
    };
  },

  _load() {
    if (this._cache) return this._cache;
    const fallback = this._blank();
    try {
      const raw = sessionStorage.getItem(QR_TELEMETRY_SESSION_KEY);
      if (!raw) {
        this._cache = fallback;
        return this._cache;
      }

      const parsed = JSON.parse(raw);
      this._cache = {
        ...fallback,
        ...(parsed || {}),
        acceptedSources: Object.assign(Object.create(null), parsed?.acceptedSources || {}),
        jsqrAttempts: Object.assign(Object.create(null), parsed?.jsqrAttempts || {}),
        jsqrSuccess: Object.assign(Object.create(null), parsed?.jsqrSuccess || {}),
        zxingAttempts: Object.assign(Object.create(null), parsed?.zxingAttempts || {}),
        zxingSuccess: Object.assign(Object.create(null), parsed?.zxingSuccess || {})
      };
      return this._cache;
    } catch (e) {
      this._cache = fallback;
      return this._cache;
    }
  },

  _save() {
    try {
      sessionStorage.setItem(QR_TELEMETRY_SESSION_KEY, JSON.stringify(this._cache || this._blank()));
    } catch (e) {
      console.warn('[DEBUG_QR] ⚠️ Não foi possível salvar telemetria da sessão:', e?.message || e);
    }
  },

  _mergeMap(target, source) {
    Object.entries(source || {}).forEach(([key, value]) => {
      target[key] = (target[key] || 0) + (Number(value) || 0);
    });
  },

  recordScan(summary) {
    const session = this._load();
    session.totalScans += 1;
    session.nativeDetections += Number(summary?.nativeDetections || 0);

    const accepted = String(summary?.acceptedSource || 'unknown');
    session.acceptedSources[accepted] = (session.acceptedSources[accepted] || 0) + 1;

    this._mergeMap(session.jsqrAttempts, summary?.jsqrAttempts);
    this._mergeMap(session.jsqrSuccess, summary?.jsqrSuccess);
    this._mergeMap(session.zxingAttempts, summary?.zxingAttempts);
    this._mergeMap(session.zxingSuccess, summary?.zxingSuccess);

    this._save();
    return session;
  },

  getTopStrategies(limit = 3) {
    const session = this._load();
    const all = [];

    const pushRank = (engine, attemptsMap, successMap) => {
      const keys = new Set([
        ...Object.keys(attemptsMap || {}),
        ...Object.keys(successMap || {})
      ]);

      keys.forEach((strategy) => {
        const attempts = Number(attemptsMap?.[strategy] || 0);
        const success = Number(successMap?.[strategy] || 0);
        if (attempts <= 0 && success <= 0) return;
        const rate = attempts > 0 ? (success / attempts) : 0;
        all.push({ engine, strategy, attempts, success, rate });
      });
    };

    pushRank('jsQR', session.jsqrAttempts, session.jsqrSuccess);
    pushRank('ZXing', session.zxingAttempts, session.zxingSuccess);

    return all
      .sort((a, b) => {
        if (b.success !== a.success) return b.success - a.success;
        if (b.rate !== a.rate) return b.rate - a.rate;
        return b.attempts - a.attempts;
      })
      .slice(0, Math.max(1, limit));
  },

  getMiniRankingText(limit = 3) {
    const top = this.getTopStrategies(limit);
    if (!top.length) return 'sem dados ainda';
    return top
      .map((item, idx) => `${idx + 1}) ${item.engine}:${item.strategy} ${item.success}/${item.attempts}`)
      .join(' • ');
  }
};

    async function setZoomLevel(value) {
      if (!activeTrack || !caps?.zoom || !Number.isFinite(value)) return;
      const targetZoom = Math.max(minZoomLevel, Math.min(maxZoomLevel, value));
      if (targetZoom === currentZoomLevel) return;
      try {
        await activeTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
        currentZoomLevel = targetZoom;
        console.log('[DEBUG_QR] 🔎 Zoom manual ajustado:', currentZoomLevel.toFixed(2));

        console.warn('[DEBUG_QR] ⚠️ Falha ao ajustar zoom manual:', err?.message);

    const scanLoopIntervalMs = isIOSDevice ? 180 : (useBasicFastProfile ? (ultraLowEndByMemory ? 320 : 240) : 120);
    const frameBudgetMs = useBasicFastProfile ? 12 : 24;

    const roiConfig = {
      sizeRatio: 0.5,
      minSize: 160,
      maxSize: 240
    };

    function setGuideColor(color) {
      cornerGuide.querySelectorAll('div').forEach(el => {
        el.style.borderColor = color;
      });
    }

    function getRoiRect(width, height) {
      const baseSize = Math.max(
        roiConfig.minSize,
        Math.min(roiConfig.maxSize, Math.floor(Math.min(width, height) * roiConfig.sizeRatio))
      );
      return {
        x: Math.max(0, Math.floor((width - baseSize) / 2)),
        y: Math.max(0, Math.floor((height - baseSize) / 2)),
        size: baseSize
      };
    }

    function updateTargetVisual(state) {
      const colors = {
        idle: '#ffffff',
        processing: '#f59e0b',
        valid: '#22c55e'
      };
      const color = colors[state] || colors.idle;
      frame.style.border = `2px solid ${color}`;
      frame.style.boxShadow = state === 'valid'
        ? '0 0 0 9999px rgba(0,0,0,0.6), 0 0 20px rgba(34,197,94,0.35)'
        : state === 'processing'
          ? '0 0 0 9999px rgba(0,0,0,0.6), 0 0 18px rgba(245,158,11,0.3)'
          : '0 0 0 9999px rgba(0,0,0,0.6)';
      setGuideColor(color);
      scanLine.style.display = state === 'processing' || state === 'valid' ? 'block' : 'none';
      scanLine.style.background = state === 'valid'
        ? 'linear-gradient(90deg,transparent,#22c55e,transparent)'
        : 'linear-gradient(90deg,transparent,#f8fafc,transparent)';
    }

    function decodeRoi(ctx, width, height, adaptiveCtx = null, isDirtyMode = false, quickMode = false) {
      try {
        const roi = getRoiRect(width, height);
        const regionImage = ctx.getImageData(roi.x, roi.y, roi.size, roi.size);
        const decoded = decodeWithVariants(regionImage, isDirtyMode, adaptiveCtx, quickMode);
        if (decoded) {
          return { code: decoded, sx: roi.x, sy: roi.y, size: roi.size };
        }
      } catch (e) {
        console.debug('[DEBUG_QR] ROI decode falhou:', e?.message || e);
      }
      return null;
    }

    function setScannerUiState(state, label) {
      const nextState = `${state}:${label || ''}`;
      if (nextState === scannerUiState) return;
      scannerUiState = nextState;
    }

    const ScanTelemetry = {
      jsqrAttempts: Object.create(null),
      jsqrSuccess: Object.create(null),
      zxingAttempts: Object.create(null),
      zxingSuccess: Object.create(null),
      nativeDetections: 0,
      acceptedSource: '',

      addAttempt(engine, key) {
        if (!key) return;
        const target = engine === 'zxing' ? this.zxingAttempts : this.jsqrAttempts;
        target[key] = (target[key] || 0) + 1;
      },

      addSuccess(engine, key) {
        if (!key) return;
        const target = engine === 'zxing' ? this.zxingSuccess : this.jsqrSuccess;
        target[key] = (target[key] || 0) + 1;
      },

      toSummary() {
        return {
          nativeDetections: this.nativeDetections,
          acceptedSource: this.acceptedSource || 'none',
          frameCount: frameTick,
          jsqrAttempts: this.jsqrAttempts,
          jsqrSuccess: this.jsqrSuccess,
          zxingAttempts: this.zxingAttempts,
          zxingSuccess: this.zxingSuccess
        };
      }
    };

    // Inicializar feedback após variáveis de estado e barra estarem prontas
    updateFeedback({
      detected: false,
      wellPositioned: false,
      tooFar: false,
      tooClose: false,
      isStable: false,
      timeRemaining: 2
    });
    setScannerUiState('active', 'Scanner ativo');

    const cleanup = () => {
      if (interval) clearInterval(interval);
      if (scanTimeoutId) {
        clearTimeout(scanTimeoutId);
        scanTimeoutId = null;
      }
      if (stream) stream.getTracks().forEach(t => t.stop());
      modal.remove();
      style.remove();
      if (ScanTelemetry.nativeDetections > 0 || Object.keys(ScanTelemetry.jsqrAttempts).length > 0 || Object.keys(ScanTelemetry.zxingAttempts).length > 0) {
        console.warn('[DEBUG_QR] 📊 Telemetria de scan:', ScanTelemetry.toSummary());
      }
    };

    const finishWithCode = (codeValue) => {
      if (settled) return;
      const normalized = String(codeValue || '').trim();
      if (!normalized) return;
      settled = true;
      setScannerUiState('success', 'QR lido com sucesso');
      statusText.textContent = 'QR lido, validando dados...';
      if (!ScanTelemetry.acceptedSource) {
        ScanTelemetry.acceptedSource = lastDetectionSource || 'unknown';
      }

      const summary = ScanTelemetry.toSummary();
      QrTelemetrySession.recordScan(summary);
      const miniRanking = QrTelemetrySession.getMiniRankingText(3);

      // Fluxo de produção: leitura confirmada automaticamente para ganhar velocidade.
      if (typeof UI !== 'undefined' && UI.showToast) {
        UI.showToast(`✅ QR lido • Top: ${miniRanking}`, '#2563eb');
      }
      // Pequeno delay melhora percepção de confirmação sem perder velocidade operacional.
      setTimeout(() => {
        cleanup();
        resolve(normalized);
      }, 450);
    };

    async function handleStaticCapture() {
      if (!stream || video.readyState < video.HAVE_CURRENT_DATA) {
        setScannerUiState('busy', 'Aguardando câmera');
        UI.showToast('Câmera ainda não pronta. Aguarde...', '#f59e0b');
        return;
      }

      if (scanLoopBusy) {
        setScannerUiState('busy', 'Processando frame');
        UI.showToast('Processando frame atual. Tente novamente em 1s.', '#f59e0b');
        return;
      }

      console.log('[DEBUG_QR] 📸 Iniciando captura estática...');
      scanPaused = true;
      setScannerUiState('capturing', 'Capturando foto estática');
      
      statusText.textContent = '📸 Capturando foto... aguarde';
      captureBtn.disabled = true;
      cancelBtn.disabled = true;

      try {
        // Em Android intermediário (ex: A23), usa escala moderada para evitar travar CPU/RAM.
        const staticScale = useBasicFastProfile ? (isGalaxyA23 ? 1.5 : 1.7) : 2;

        // Criar canvas de alta resolução moderada
        const hires = document.createElement('canvas');
        hires.width = Math.max(640, Math.floor(video.videoWidth * staticScale));
        hires.height = Math.max(480, Math.floor(video.videoHeight * staticScale));
        const ctx = hires.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(video, 0, 0, hires.width, hires.height);

        console.log('[DEBUG_QR] 📐 Canvas alta resolução:', hires.width, 'x', hires.height);
        console.log('[DEBUG_QR] 📚 Bibliotecas disponíveis para captura:', {
          jsQR: typeof jsQR !== 'undefined',
          ZXing: typeof ZXing !== 'undefined' && ZXing.QRCodeReader,
          BarcodeDetector: 'BarcodeDetector' in window
        });

        // Tentar ZXing primeiro (mais tolerante em foto estática)
        let code = null;

        if (typeof ZXing !== 'undefined' && ZXing.QRCodeReader) {
          console.log('[DEBUG_QR] 🏭 Tentando ZXing em alta resolução...');
          try {
            const imageData = ctx.getImageData(0, 0, hires.width, hires.height);
            const width = hires.width;
            const height = hires.height;

            // Aplicar equalizações agressivas para foto estática
            const equalized = equalizeHistogram(imageData);
            const aggressive = toAggressiveBinary(imageData);

            // REMOVIDA RESTRIÇÃO useBasicFastProfile - usar sempre 3 variantes para melhor detecção
            const variants = [
                { data: equalized, name: 'equalized-hires' },
                { data: aggressive, name: 'aggressive-hires' },
                { data: imageData.data, name: 'original-hires' }
              ];

            for (const variant of variants) {
              try {
                ScanTelemetry.addAttempt('zxing', `static-${variant.name}`);
                const luminances = new Uint8ClampedArray(width * height);
                for (let i = 0, j = 0; i < variant.data.length; i += 4, j++) {
                  const r = variant.data[i];
                  const g = variant.data[i + 1];
                  const b = variant.data[i + 2];
                  luminances[j] = Math.floor(0.299 * r + 0.587 * g + 0.114 * b);
                }

                const luminanceSource = new ZXing.RGBLuminanceSource(luminances, width, height);
                const binaryBitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));
                const reader = new ZXing.QRCodeReader();
                const result = reader.decode(binaryBitmap);

                if (result?.text) {
                  ScanTelemetry.addSuccess('zxing', `static-${variant.name}`);
                  lastDetectionSource = `static:zxing:${variant.name}`;
                  console.log('[DEBUG_QR] ✅ ZXing hires leu:', result.text.substring(0, 30) + '...');
                  code = result.text;
                  break;
                }
              } catch (e) {}
            }
          } catch (zxingErr) {
            console.warn('[DEBUG_QR] ZXing hires falhou:', zxingErr?.message);
          }
        }

        // Fallback: jsQR em alta resolução
        if (!code && typeof jsQR !== 'undefined') {
          console.log('[DEBUG_QR] 📷 Tentando jsQR em alta resolução...');
          const imageData = ctx.getImageData(0, 0, hires.width, hires.height);
          ScanTelemetry.addAttempt('jsqr', 'static-original-hires');
          code = jsQR(imageData.data, hires.width, hires.height, { inversionAttempts: 'attemptBoth' });
          if (code) {
            ScanTelemetry.addSuccess('jsqr', 'static-original-hires');
            lastDetectionSource = 'static:jsqr:original-hires';
            console.log('[DEBUG_QR] ✅ jsQR hires leu:', code.data.substring(0, 30) + '...');
            code = code.data;
          }
        }

        if (!code && detector) {
          try {
            const results = await detector.detect(hires);
            const first = Array.isArray(results) ? results[0] : null;
            const rawValue = first?.rawValue;
            if (rawValue) {
              ScanTelemetry.nativeDetections++;
              lastDetectionSource = 'static:barcodedetector';
              console.log('[DEBUG_QR] 📱 BarcodeDetector estático leu:', rawValue.substring(0, 30) + '...');
              code = rawValue;
            }
          } catch (nativeErr) {
            console.warn('[DEBUG_QR] BarcodeDetector estático falhou:', nativeErr?.message || nativeErr);
          }
        }

        if (code) {
          console.log('[DEBUG_QR] ✅ Captura estática bem-sucedida!');
          statusText.textContent = '✅ QR lido da foto estática!';
          setGuideColor('#34c759');
          frame.style.boxShadow = '0 0 22px rgba(52,199,89,.55)';
          
          setTimeout(() => {
            finishWithCode(code);
          }, 500);
        } else {
          statusText.textContent = '❌ Nenhum QR encontrado na foto. Tente novamente.';
          setScannerUiState('error', 'Falha na captura, tente novamente');
          UI.showToast('Nenhum QR lido na captura. Posicione melhor ou tente escanear.', '#ef4444');
          captureBtn.disabled = false;
          cancelBtn.disabled = false;
          scanPaused = false;
          setTimeout(() => {
            if (!settled) setScannerUiState('active', 'Scanner ativo');
          }, 500);
        }
      } catch (err) {
        console.error('[DEBUG_QR] ❌ Erro na captura estática:', err);
        statusText.textContent = '❌ Erro na captura: ' + (err.message || 'desconhecido');
        setScannerUiState('error', 'Erro na captura');
        UI.showToast('Erro ao capturar: ' + err.message, '#ef4444');
        captureBtn.disabled = false;
        cancelBtn.disabled = false;
        scanPaused = false;
        setTimeout(() => {
          if (!settled) setScannerUiState('active', 'Scanner ativo');
        }, 500);
      }
    }

    // ✅ FUNÇÃO: Detectar brightness da imagem (para Galaxy A23 e câmeras ruins)
    function detectBrightness(imageData) {
      const data = imageData.data;
      let sum = 0;
      const step = Math.max(1, Math.floor(data.length / 4096)); // Amostra ~1024 pixels
      
      for (let i = 0; i < data.length; i += step * 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
        sum += brightness;
      }
      
      const sampled = data.length / (step * 4);
      const avg = sampled > 0 ? sum / sampled : 128;
      
      // Manter trend de brightness para detecção suave
      brightnessTrendBuffer.push(avg);
      if (brightnessTrendBuffer.length > 10) brightnessTrendBuffer.shift();
      
      const trendAvg = brightnessTrendBuffer.reduce((a, b) => a + b, 0) / brightnessTrendBuffer.length;
      isDarkScene = trendAvg < 85; // Cena muito escura
      averageBrightness = Math.round(trendAvg);
      
      return {
        current: avg,
        trend: trendAvg,
        isDark: isDarkScene
      };
    }
    
    // ✅ FUNÇÃO: Auto-exposição para câmeras inferiores (Galaxy A23)
    function applyAutoExposure(isActive = false) {
      if (!activeTrack || !isGalaxyA23) return;
      
      try {
        const caps = activeTrack.getCapabilities?.();
        if (!caps) return;
        
        const advanced = [];
        
        // Aumentar exposição em cenas escuras
        if (isDarkScene && caps.exposureCompensation) {
          const maxExp = caps.exposureCompensation.max || 2;
          const compensation = Math.min(maxExp, 1.5); // +1.5 stops
          advanced.push({ exposureCompensation: compensation });
          console.log('[DEBUG_QR] 🔆 Exposição aumentada para cena escura:', compensation);
        }
        
        // Force brightness em cena escura
        if (isDarkScene && caps.brightness) {
          const maxBrightness = caps.brightness.max || 255;
          const targetBright = Math.floor(maxBrightness * 0.65); // 65% brightness
          advanced.push({ brightness: targetBright });
          console.log('[DEBUG_QR] 💡 Brightness aumentado:', targetBright);
        }
        
        // Aumentar contrast em cena escura
        if (isDarkScene && caps.contrast) {
          const maxContrast = caps.contrast.max || 255;
          const targetContrast = Math.floor(maxContrast * 0.75); // 75% contrast
          advanced.push({ contrast: targetContrast });
          console.log('[DEBUG_QR] 📊 Contrast aumentado:', targetContrast);
        }
        
        // Manutenção do white balance
        if (caps.whiteBalanceMode && Array.isArray(caps.whiteBalanceMode) && caps.whiteBalanceMode.includes('continuous')) {
          advanced.push({ whiteBalanceMode: 'continuous' });
        }
        
        if (advanced.length > 0) {
          activeTrack.applyConstraints({ advanced }).catch(err => {
            console.warn('[DEBUG_QR] ⚠️ Auto-exposição parcialmente falhada:', err?.message);
          });
        }
      } catch (err) {
        console.warn('[DEBUG_QR] ⚠️ Falha ao aplicar auto-exposição:', err?.message);
      }
    }

    // Handler: Captura estática (foto) com decode em alta resolução
    captureBtn.onclick = handleStaticCapture;
    captureBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handleStaticCapture();
    }, { passive: false });

    function handleCancelScan() {
      settled = true;
      setScannerUiState('error', 'Leitura cancelada');
      cleanup();
      reject(new Error('Cancelado'));
    }

    cancelBtn.onclick = handleCancelScan;
    cancelBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handleCancelScan();
    }, { passive: false });

    // =========================
    // POSICIONAMENTO
    // =========================
    function isInsideTarget(location, target) {
      const points = [
        location.topLeftCorner,
        location.topRightCorner,
        location.bottomLeftCorner,
        location.bottomRightCorner
      ];
      return points.every(p =>
        p.x >= target.x &&
        p.y >= target.y &&
        p.x <= target.x + target.size &&
        p.y <= target.y + target.size
      );
    }

    function getQrCenter(location) {
      const xs = [
        location.topLeftCorner.x,
        location.topRightCorner.x,
        location.bottomLeftCorner.x,
        location.bottomRightCorner.x
      ];
      const ys = [
        location.topLeftCorner.y,
        location.topRightCorner.y,
        location.bottomLeftCorner.y,
        location.bottomRightCorner.y
      ];
      return {
        x: xs.reduce((a, b) => a + b, 0) / xs.length,
        y: ys.reduce((a, b) => a + b, 0) / ys.length
      };
    }

    function isCenteredEnough(location, target, tolerance = 32) {
      const center = getQrCenter(location);
      return (
        center.x >= (target.x - tolerance) &&
        center.y >= (target.y - tolerance) &&
        center.x <= (target.x + target.size + tolerance) &&
        center.y <= (target.y + target.size + tolerance)
      );
    }


    function markDetected(codeData, message) {
      // Para QR bem-posicionado, aceita imediatamente após primeira detecção
      const sameCode = codeData === lastCodeData;
      const isStable = sameCode && stableCount >= 0; // Se é o mesmo código
      stableCount = sameCode ? stableCount + 1 : 1;
      lastCodeData = codeData;

      setGuideColor('#34c759');
      frame.style.boxShadow = '0 0 22px rgba(52,199,89,.55)';
      scanLine.style.animationPlayState = 'paused';
      statusText.textContent = message || 'QR detectado, confirmando leitura...';
      
      console.log('[DEBUG_QR] 🎯 markDetected chamado | stableCount:', stableCount, '| sameCode:', sameCode, '| código:', codeData.substring(0, 30) + '...');

      // ✅ Confirma com 1 leitura para QR bem posicionado (empresas usam confirmação única)
      if (stableCount >= 1) {
        console.log('[DEBUG_QR] ✅ Código bem-posicionado confirmado! Resolvendo...');
        if (!ScanTelemetry.acceptedSource) {
          ScanTelemetry.acceptedSource = lastDetectionSource || 'unknown';
        }
        finishWithCode(codeData);
        return true;
      }

      return false;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function buildAdaptiveContext(imageData, isDirtyMode) {
      const data = imageData.data;
      const pixelCount = Math.max(1, (data.length / 4) | 0);
      const step = Math.max(1, Math.floor(pixelCount / 1024));

      let sum = 0;
      let sumSq = 0;
      let min = 255;
      let max = 0;
      let sampled = 0;

      for (let p = 0; p < pixelCount; p += step) {
        const i = p * 4;
        const gray = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
        sum += gray;
        sumSq += gray * gray;
        if (gray < min) min = gray;
        if (gray > max) max = gray;
        sampled++;
      }

      const avg = sampled > 0 ? (sum / sampled) : 128;
      const variance = sampled > 0 ? Math.max(0, (sumSq / sampled) - (avg * avg)) : 0;
      const stdDev = Math.sqrt(variance);
      const contrast = Math.max(1, max - min);

      const darkScene = avg < 95;
      const brightScene = avg > 180;
      const lowContrast = contrast < 55;
      const noisyFrame = stdDev > 52;

      const binaryThreshold = clamp(
        avg + (darkScene ? -8 : 0) + (brightScene ? 6 : 0) + (lowContrast ? -6 : 0),
        70,
        190
      );

      const aggressiveFactor = clamp(
        (isDirtyMode ? 0.76 : 0.8) + (darkScene ? -0.03 : 0) + (lowContrast ? -0.03 : 0) + (noisyFrame ? -0.02 : 0),
        0.66,
        0.86
      );

      const aggressiveRadius = clamp(
        9 + (isDirtyMode ? 2 : 0) + (lowContrast ? 2 : 0) + (noisyFrame ? 1 : 0),
        8,
        14
      );

      const maskBottomRatio = clamp(
        0.24 + (isDirtyMode ? 0.08 : 0) + (lowContrast ? 0.04 : 0),
        0.2,
        0.42
      );

      return {
        avg,
        stdDev,
        contrast,
        lowContrast,
        binaryThreshold,
        aggressiveFactor,
        aggressiveRadius,
        maskBottomRatio
      };
    }

    // =========================================================================
    // 🏭 PRE-PROCESSAMENTO AVANÇADO (PADRÃO INDUSTRIAL)
    // =========================================================================
    
    function sharpenImage(imageData) {
      // Unsharp mask para melhorar bordas borradas (usado por Amazon/FedEx)
      const src = imageData.data;
      const width = imageData.width;
      const height = imageData.height;
      const out = new Uint8ClampedArray(src.length);
      
      // Kernel de sharpening (Laplacian)
      const kernel = [
        [0, -1, 0],
        [-1, 5, -1],
        [0, -1, 0]
      ];
      
      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          let r = 0, g = 0, b = 0;
          
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const idx = ((y + ky) * width + (x + kx)) * 4;
              const weight = kernel[ky + 1][kx + 1];
              r += src[idx] * weight;
              g += src[idx + 1] * weight;
              b += src[idx + 2] * weight;
            }
          }
          
          const outIdx = (y * width + x) * 4;
          out[outIdx] = Math.max(0, Math.min(255, r));
          out[outIdx + 1] = Math.max(0, Math.min(255, g));
          out[outIdx + 2] = Math.max(0, Math.min(255, b));
          out[outIdx + 3] = 255;
        }
      }
      
      return out;
    }
    
    function denoiseImage(imageData) {
      // Median filter para remover ruído (etiquetas de tecido)
      const src = imageData.data;
      const width = imageData.width;
      const height = imageData.height;
      const out = new Uint8ClampedArray(src.length);
      
      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const neighbors = [];
          
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const idx = ((y + dy) * width + (x + dx)) * 4;
              const lum = (src[idx] * 0.299 + src[idx + 1] * 0.587 + src[idx + 2] * 0.114) | 0;
              neighbors.push(lum);
            }
          }
          
          neighbors.sort((a, b) => a - b);
          const median = neighbors[4]; // Centro de 9 valores
          
          const outIdx = (y * width + x) * 4;
          out[outIdx] = median;
          out[outIdx + 1] = median;
          out[outIdx + 2] = median;
          out[outIdx + 3] = 255;
        }
      }
      
      return out;
    }

    function toGrayscaleHighContrast(imageData) {
      const src = imageData.data;
      const out = new Uint8ClampedArray(src.length);

      let minLum = 255;
      let maxLum = 0;

      for (let i = 0; i < src.length; i += 4) {
        const lum = (src[i] * 0.299 + src[i + 1] * 0.587 + src[i + 2] * 0.114) | 0;
        if (lum < minLum) minLum = lum;
        if (lum > maxLum) maxLum = lum;
      }

      const range = Math.max(1, maxLum - minLum);

      for (let i = 0; i < src.length; i += 4) {
        const lum = (src[i] * 0.299 + src[i + 1] * 0.587 + src[i + 2] * 0.114) | 0;
        const normalized = Math.max(0, Math.min(255, ((lum - minLum) * 255) / range));
        out[i] = normalized;
        out[i + 1] = normalized;
        out[i + 2] = normalized;
        out[i + 3] = 255;
      }

      return out;
    }

    function toAdaptiveBinary(imageData, adaptiveCtx = null) {
      const src = imageData.data;
      const out = new Uint8ClampedArray(src.length);
      let sum = 0;
      let pixels = 0;

      for (let i = 0; i < src.length; i += 4) {
        const lum = (src[i] * 0.299 + src[i + 1] * 0.587 + src[i + 2] * 0.114) | 0;
        sum += lum;
        pixels++;
      }

      const avg = pixels > 0 ? (sum / pixels) : 128;
      const threshold = adaptiveCtx && Number.isFinite(adaptiveCtx.binaryThreshold)
        ? adaptiveCtx.binaryThreshold
        : Math.max(80, Math.min(180, avg));

      for (let i = 0; i < src.length; i += 4) {
        const lum = (src[i] * 0.299 + src[i + 1] * 0.587 + src[i + 2] * 0.114) | 0;
        const bw = lum > threshold ? 255 : 0;
        out[i] = bw;
        out[i + 1] = bw;
        out[i + 2] = bw;
        out[i + 3] = 255;
      }

      return out;
    }

    function maskLowerLeftNoise(data, width, height, coverXRatio = 0.35, coverYRatio = 0.35) {
      const out = new Uint8ClampedArray(data);
      const xMax = Math.max(1, Math.floor(width * coverXRatio));
      const yStart = Math.max(0, Math.floor(height * (1 - coverYRatio)));

      for (let y = yStart; y < height; y++) {
        for (let x = 0; x < xMax; x++) {
          const idx = (y * width + x) * 4;
          out[idx] = 255;
          out[idx + 1] = 255;
          out[idx + 2] = 255;
          out[idx + 3] = 255;
        }
      }

      return out;
    }
    
    // Nova função: Mascarar todo o perímetro inferior (bottom edge completo)
    function maskBottomEdge(data, width, height, coverYRatio = 0.30) {
      const out = new Uint8ClampedArray(data);
      const yStart = Math.max(0, Math.floor(height * (1 - coverYRatio)));

      for (let y = yStart; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          out[idx] = 255;
          out[idx + 1] = 255;
          out[idx + 2] = 255;
          out[idx + 3] = 255;
        }
      }

      return out;
    }
    
    // ✅ NOVO: Equalização de histograma para melhorar contraste em códigos sujos
    function equalizeHistogram(imageData) {
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;
      const out = new Uint8ClampedArray(data.length);
      const histogram = new Array(256).fill(0);
      
      // Calcular histograma de luminância
      for (let i = 0; i < data.length; i += 4) {
        const gray = Math.floor(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
        histogram[gray]++;
      }
      
      // Calcular CDF (Cumulative Distribution Function)
      const cdf = new Array(256).fill(0);
      cdf[0] = histogram[0];
      for (let i = 1; i < 256; i++) {
        cdf[i] = cdf[i - 1] + histogram[i];
      }
      
      // Normalizar CDF
      const totalPixels = width * height;
      const cdfMin = cdf.find(v => v > 0) || 0;
      const lookup = new Array(256);
      for (let i = 0; i < 256; i++) {
        lookup[i] = Math.round(((cdf[i] - cdfMin) / (totalPixels - cdfMin)) * 255);
      }
      
      // Aplicar equalização
      for (let i = 0; i < data.length; i += 4) {
        const gray = Math.floor(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
        const equalized = lookup[gray] || 0;
        out[i] = equalized;
        out[i + 1] = equalized;
        out[i + 2] = equalized;
        out[i + 3] = 255;
      }
      
      return out;
    }

    // ✅ NOVO: Threshold adaptativo mais agressivo para QR muito sujos
    function toAggressiveBinary(imageData, adaptiveCtx = null) {
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;
      const out = new Uint8ClampedArray(data.length);
      const radius = adaptiveCtx && Number.isFinite(adaptiveCtx.aggressiveRadius)
        ? adaptiveCtx.aggressiveRadius
        : 10;
      const thresholdFactor = adaptiveCtx && Number.isFinite(adaptiveCtx.aggressiveFactor)
        ? adaptiveCtx.aggressiveFactor
        : 0.78;
      const integralWidth = width + 1;
      const integralHeight = height + 1;
      const integral = new Float32Array(integralWidth * integralHeight);

      for (let y = 1; y <= height; y++) {
        let rowSum = 0;
        for (let x = 1; x <= width; x++) {
          const idx = ((y - 1) * width + (x - 1)) * 4;
          const gray = (0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2]);
          rowSum += gray;
          integral[y * integralWidth + x] = integral[(y - 1) * integralWidth + x] + rowSum;
        }
      }

      for (let y = 0; y < height; y++) {
        const y0 = Math.max(0, y - radius);
        const y1 = Math.min(height - 1, y + radius);

        for (let x = 0; x < width; x++) {
          const x0 = Math.max(0, x - radius);
          const x1 = Math.min(width - 1, x + radius);

          const A = integral[y0 * integralWidth + x0];
          const B = integral[y0 * integralWidth + (x1 + 1)];
          const C = integral[(y1 + 1) * integralWidth + x0];
          const D = integral[(y1 + 1) * integralWidth + (x1 + 1)];
          const count = (x1 - x0 + 1) * (y1 - y0 + 1);
          const localMean = count > 0 ? (D - B - C + A) / count : 128;

          const idx = (y * width + x) * 4;
          const gray = (0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2]);
          const threshold = localMean * thresholdFactor;
          const binaryVal = gray > threshold ? 255 : 0;

          out[idx] = binaryVal;
          out[idx + 1] = binaryVal;
          out[idx + 2] = binaryVal;
          out[idx + 3] = 255;
        }
      }

      return out;
    }

    // ✅ NOVO: Desfoque gaussiano leve (remove ruído sem perder detalhes)
    function gaussianBlur(imageData) {
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;
      const out = new Uint8ClampedArray(data.length);
      
      // Kernel Gaussiano 3x3 normalizado
      const kernel = [
        1/16, 2/16, 1/16,
        2/16, 4/16, 2/16,
        1/16, 2/16, 1/16
      ];
      
      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          let r = 0, g = 0, b = 0;
          let ki = 0;
          
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const idx = ((y + dy) * width + (x + dx)) * 4;
              const k = kernel[ki++];
              r += data[idx] * k;
              g += data[idx + 1] * k;
              b += data[idx + 2] * k;
            }
          }
          
          const idx = (y * width + x) * 4;
          out[idx] = r;
          out[idx + 1] = g;
          out[idx + 2] = b;
          out[idx + 3] = 255;
        }
      }
      
      // Copiar bordas
      for (let x = 0; x < width; x++) {
        const idx0 = x * 4;
        const idxH = ((height - 1) * width + x) * 4;
        for (let c = 0; c < 3; c++) {
          out[idx0 + c] = data[idx0 + c];
          out[idxH + c] = data[idxH + c];
        }
        out[idx0 + 3] = 255;
        out[idxH + 3] = 255;
      }
      for (let y = 0; y < height; y++) {
        const idx0 = y * width * 4;
        const idxW = (y * width + width - 1) * 4;
        for (let c = 0; c < 3; c++) {
          out[idx0 + c] = data[idx0 + c];
          out[idxW + c] = data[idxW + c];
        }
        out[idx0 + 3] = 255;
        out[idxW + 3] = 255;
      }
      
      return out;
    }

    function upscaleImageData(sourceData, width, height, scale = 2) {
      const targetW = Math.max(1, Math.floor(width * scale));
      const targetH = Math.max(1, Math.floor(height * scale));
      const out = new Uint8ClampedArray(targetW * targetH * 4);

      for (let y = 0; y < targetH; y++) {
        const sy = Math.min(height - 1, Math.floor(y / scale));
        for (let x = 0; x < targetW; x++) {
          const sx = Math.min(width - 1, Math.floor(x / scale));
          const sIdx = (sy * width + sx) * 4;
          const tIdx = (y * targetW + x) * 4;
          out[tIdx] = sourceData[sIdx];
          out[tIdx + 1] = sourceData[sIdx + 1];
          out[tIdx + 2] = sourceData[sIdx + 2];
          out[tIdx + 3] = 255;
        }
      }

      return { data: out, width: targetW, height: targetH };
    }

    function downscaleImageData(sourceData, width, height, scale = 0.75) {
      const safeScale = Math.max(0.35, Math.min(0.95, Number(scale) || 0.75));
      const targetW = Math.max(1, Math.floor(width * safeScale));
      const targetH = Math.max(1, Math.floor(height * safeScale));
      const out = new Uint8ClampedArray(targetW * targetH * 4);

      for (let y = 0; y < targetH; y++) {
        const sy = Math.min(height - 1, Math.floor(y / safeScale));
        for (let x = 0; x < targetW; x++) {
          const sx = Math.min(width - 1, Math.floor(x / safeScale));
          const sIdx = (sy * width + sx) * 4;
          const tIdx = (y * targetW + x) * 4;
          out[tIdx] = sourceData[sIdx];
          out[tIdx + 1] = sourceData[sIdx + 1];
          out[tIdx + 2] = sourceData[sIdx + 2];
          out[tIdx + 3] = 255;
        }
      }

      return { data: out, width: targetW, height: targetH };
    }

    function decodeWithVariants(imageData, isDirtyMode = false, adaptiveCtx = null, quickMode = false) {
      if (typeof jsQR !== 'function') {
        return null;
      }

      const width = imageData.width;
      const height = imageData.height;

      const lazy = {
        contrast: null,
        binary: null,
        upscaledOriginal: null,
        upscaledContrast: null,
        equalized: null,
        aggressive: null,
        denoised: null,
        sharpened: null,
        denoiseThenAggressive: null,
        sharpenThenAggressive: null,
        upscaledAggressive: null,
        downscaled75: null,
        downscaled50: null,
        maskedLowerLeft: null,
        maskedBottom: null
      };

      const getContrast = () => (lazy.contrast ||= toGrayscaleHighContrast(imageData));
      const getBinary = () => (lazy.binary ||= toAdaptiveBinary(imageData, adaptiveCtx));
      const getUpscaledOriginal = () => (lazy.upscaledOriginal ||= upscaleImageData(imageData.data, width, height, 2));
      const getUpscaledContrast = () => (lazy.upscaledContrast ||= upscaleImageData(getContrast(), width, height, 2));
      const getAggressive = () => (lazy.aggressive ||= toAggressiveBinary(imageData, adaptiveCtx));
      const getEqualized = () => (lazy.equalized ||= equalizeHistogram(imageData));
      const getDenoised = () => (lazy.denoised ||= denoiseImage(imageData));
      const getSharpened = () => (lazy.sharpened ||= sharpenImage(imageData));
      const getDenoiseThenAggressive = () => (lazy.denoiseThenAggressive ||= toAggressiveBinary({ data: getDenoised(), width, height }, adaptiveCtx));
      const getSharpenThenAggressive = () => (lazy.sharpenThenAggressive ||= toAggressiveBinary({ data: getSharpened(), width, height }, adaptiveCtx));
      const getUpscaledAggressive = () => (lazy.upscaledAggressive ||= upscaleImageData(getAggressive(), width, height, 2));
      const getDownscaled75 = () => (lazy.downscaled75 ||= downscaleImageData(imageData.data, width, height, 0.75));
      const getDownscaled50 = () => (lazy.downscaled50 ||= downscaleImageData(imageData.data, width, height, 0.5));
      const getMaskedLowerLeft = () => (lazy.maskedLowerLeft ||= maskLowerLeftNoise(imageData.data, width, height, 0.40, 0.40));
      const getMaskedBottom = () => {
        if (lazy.maskedBottom) return lazy.maskedBottom;
        const maskRatio = adaptiveCtx && Number.isFinite(adaptiveCtx.maskBottomRatio)
          ? adaptiveCtx.maskBottomRatio
          : 0.30;
        lazy.maskedBottom = maskBottomEdge(imageData.data, width, height, maskRatio);
        return lazy.maskedBottom;
      };

      let variants = [];

      if (useBasicFastProfile) {
        variants = quickMode
          ? [
              { getter: () => imageData.data, name: 'original-fast' },
              { getter: () => getDownscaled75().data, name: 'downscaled-75-fast', width: () => getDownscaled75().width, height: () => getDownscaled75().height },
              { getter: getBinary, name: 'binary-fast' }
            ]
          : [
              { getter: () => imageData.data, name: 'original' },
              { getter: () => getDownscaled75().data, name: 'downscaled-75', width: () => getDownscaled75().width, height: () => getDownscaled75().height },
              { getter: getBinary, name: 'binary' }
            ];
      } else if (quickMode && !isDirtyMode) {
        variants = [
          { getter: () => imageData.data, name: 'original-fast' },
          { getter: () => getDownscaled75().data, name: 'downscaled-75-fast', width: () => getDownscaled75().width, height: () => getDownscaled75().height },
          { getter: getBinary, name: 'binary-fast' }
        ];
      } else if (!isDirtyMode) {
        variants = [
          { getter: () => imageData.data, name: 'original' },
          { getter: () => getDownscaled75().data, name: 'downscaled-75', width: () => getDownscaled75().width, height: () => getDownscaled75().height },
          { getter: () => getDownscaled50().data, name: 'downscaled-50', width: () => getDownscaled50().width, height: () => getDownscaled50().height },
          { getter: getContrast, name: 'contrast' },
          { getter: () => getUpscaledOriginal().data, name: 'upscaled-original', width: () => getUpscaledOriginal().width, height: () => getUpscaledOriginal().height },
          { getter: getBinary, name: 'binary' }
        ];
      } else {
        variants = [
          { getter: () => getDownscaled75().data, name: 'downscaled-75', width: () => getDownscaled75().width, height: () => getDownscaled75().height },
          { getter: getDenoiseThenAggressive, name: 'denoise-aggressive' },
          { getter: getSharpenThenAggressive, name: 'sharpen-aggressive' },
          { getter: getEqualized, name: 'equalized' },
          { getter: getAggressive, name: 'aggressive-binary' },
          { getter: () => getUpscaledAggressive().data, name: 'upscaled-aggressive', width: () => getUpscaledAggressive().width, height: () => getUpscaledAggressive().height },
          { getter: getMaskedLowerLeft, name: 'masked-lower-left' },
          { getter: () => getUpscaledOriginal().data, name: 'upscaled-original', width: () => getUpscaledOriginal().width, height: () => getUpscaledOriginal().height },
          { getter: () => getUpscaledContrast().data, name: 'upscaled-contrast', width: () => getUpscaledContrast().width, height: () => getUpscaledContrast().height },
          { getter: getContrast, name: 'contrast' },
          { getter: getBinary, name: 'binary' },
          { getter: getMaskedBottom, name: 'masked-bottom' },
          { getter: () => imageData.data, name: 'original' }
        ];
      }

      for (const variant of variants) {
        const variantData = variant.getter();
        const vWidth = typeof variant.width === 'function' ? variant.width() : (variant.width || width);
        const vHeight = typeof variant.height === 'function' ? variant.height() : (variant.height || height);
        ScanTelemetry.addAttempt('jsqr', variant.name);
        const decoded = jsQR(variantData, vWidth, vHeight, { inversionAttempts: 'attemptBoth' });
        if (decoded) {
          ScanTelemetry.addSuccess('jsqr', variant.name);
          if (variant.name !== 'original') {
            console.log('[DEBUG_QR] ✅ jsQR leu com:', variant.name);
          }
          decoded.__strategy = `jsqr:${variant.name}`;
          return decoded;
        }
      }

      return null;
    }

    function tryDecodeRegion(ctx, x, y, size, isDirtyMode = false, adaptiveCtx = null, quickMode = false) {
      try {
        const img = ctx.getImageData(x, y, size, size);
        return decodeWithVariants(img, isDirtyMode, adaptiveCtx, quickMode);
      } catch (e) {
        return null;
      }
    }

    function decodeMultiPass(ctx, width, height, isDirtyMode = false, adaptiveCtx = null, quickMode = false) {
      const baseSize = Math.floor(Math.min(width, height));
      // ✅ Passes otimizados para cobrir QR em diferentes posições/tamanhos
      const scans = useBasicFastProfile
        ? [
            { ratio: 1.0, dx: 0, dy: 0 },
            { ratio: 0.9, dx: 0, dy: 0 }
          ]
        : quickMode
        ? [
            { ratio: 1.0, dx: 0, dy: 0 },
            { ratio: 0.9, dx: 0, dy: 0 }
          ]
        : [
            { ratio: 1.0, dx: 0, dy: 0 },
            { ratio: 0.92, dx: 0, dy: 0 },
            { ratio: 0.78, dx: 0.15, dy: -0.12 },
            { ratio: 0.78, dx: -0.15, dy: 0.12 },
            { ratio: 0.65, dx: 0, dy: 0 }
          ];

      if (isDirtyMode && !quickMode) {
        scans.push(
          { ratio: 0.88, dx: 0.10, dy: 0 },
          { ratio: 0.88, dx: -0.10, dy: 0 },
          { ratio: 0.72, dx: -0.20, dy: -0.15 },
          { ratio: 0.72, dx: 0.20, dy: 0.15 },
          { ratio: 0.58, dx: 0, dy: 0 }
        );
      }

      for (let i = 0; i < scans.length; i++) {
        const ratio = scans[i].ratio;
        const size = Math.max(220, Math.floor(baseSize * ratio));

        const centeredX = (width - size) / 2;
        const centeredY = (height - size) / 2;
        const shiftedX = centeredX + (size * (scans[i].dx || 0));
        const shiftedY = centeredY + (size * (scans[i].dy || 0));

        const sx = Math.max(0, Math.min(Math.floor(shiftedX), Math.max(0, width - size)));
        const sy = Math.max(0, Math.min(Math.floor(shiftedY), Math.max(0, height - size)));

        const decoded = tryDecodeRegion(ctx, sx, sy, size, isDirtyMode, adaptiveCtx, quickMode);
        if (decoded) {
          return { code: decoded, sx, sy, size };
        }
      }

      return null;
    }

    async function start() {
      console.log('[DEBUG_QR] 🎬 Função start() iniciada - solicitando acesso à câmera...');
      
      try {

                aspectRatio: { ideal: 1.777 }

            : {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 30, min: 15 }
              };

          const baseVideoConstraints = isIOSDevice
            ? {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 24, min: 15 }
              }
            : androidVideoConstraints;

          stream = await navigator.mediaDevices.getUserMedia({
            video: baseVideoConstraints,

          });

        } catch (constraintError) {

          console.log('[DEBUG_QR] 🔄 Tentando com constraints mínimos...');

          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { exact: 'environment' },
              width: { ideal: isGalaxyA23 ? 1280 : 960 },
              height: { ideal: isGalaxyA23 ? 720 : 540 },
              frameRate: { ideal: 24, min: 12 }
            },
            audio: false
          });
          console.log('[DEBUG_QR] ✅ Camera com constraints mínimos obtida');
        }

        // A23: força tentativa de troca para câmera traseira principal para evitar lente macro/desfocada.
        if (!isIOSDevice && (!useBasicFastProfile || isGalaxyA23)) {

                stream = switchedStream;

        }
        
        console.log('[DEBUG_QR] ✅ Acesso à câmera concedido!');
        console.log('[DEBUG_QR] Stream obtido:', stream);

        video.srcObject = stream;
        await video.play();
        console.log('[DEBUG_QR] ▶️ Vídeo iniciado');

        // Zoom + foco (quando disponível)
        activeTrack = stream.getVideoTracks()[0];
        caps = activeTrack.getCapabilities?.();
        const advanced = [];

        if (caps?.focusMode && Array.isArray(caps.focusMode)) {
          if (caps.focusMode.includes('continuous') && !isIOSDevice) {

          advanced.push({ whiteBalanceMode: 'continuous' });

        if (caps?.zoom) {
          minZoomLevel = Number(caps.zoom.min || 1);
          maxZoomLevel = Number(caps.zoom.max || minZoomLevel);
          minZoomLevel = Math.max(1, minZoomLevel);

          // 🚀 PATCH PARA MULTIPLICAR O ZOOM NO MICRO QR CODE 1x1
          // Em vez de calcular percentual dinâmico lento, força direto 2.8x ou o limite do aparelho
          const targetInitialZoom = Math.min(2.8, maxZoomLevel);
          const initialZoom = Math.max(minZoomLevel, targetInitialZoom);

        console.log('[DEBUG_QR] 📹 Configurações de câmera aplicadas');

        // Detector nativo do Chrome/Android e alguns iPhones modernos.

      } catch (error) {
