// =========================================================================
// 1.5 EVENT LISTENER TRACKER (Evita memory leak)
// =========================================================================
const ListenerTracker = {
  listeners: [],
  
  on(element, event, handler) {
    if (!element) return;
    element.addEventListener(event, handler);
    this.listeners.push({ element, event, handler });
  },
  
  removeAll() {
    this.listeners.forEach(({ element, event, handler }) => {
      try { element.removeEventListener(event, handler); } catch (e) {}
    });
    this.listeners = [];
  }
};

// =========================================================================
// 2. UTILIDADES
// =========================================================================
const Utils = {
  toSnakeCase(s) {
    if (s === null || s === undefined) return s;
    return String(s)
      .replace(/([a-z0-9])([A-Z])/g, '$1_$2')
      .replace(/[^\w\d_]+/g, '_')
      .replace(/__+/g, '_')
      .replace(/^_+|_+$/, '')
      .toLowerCase();
  },

  toSnakeCaseObject(obj) {
    const norm = {};
    Object.keys(obj || {}).forEach(k => {
      norm[this.toSnakeCase(k)] = obj[k];
    });
    return norm;
  },

  escapeHtml(s) {
    if (s === null || s === undefined) return '';
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return String(s).replace(/[&<>"']/g, m => map[m]);
  },
  
  // Debounce para otimizar eventos frequentes
  debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  },
  
  // Throttle para limitar frequência de execução
  throttle(func, limit) {
    let inThrottle;
    return function(...args) {
      if (!inThrottle) {
        func.apply(this, args);
        inThrottle = true;
        setTimeout(() => inThrottle = false, limit);
      }
    };
  }
};

// Helper para selects / inputs
function sel(...ids) {
  for (const id of ids) {
    const el = UI.getEl(id);
    if (!el) continue;

    if (el.tagName === 'SELECT') {
      const opt = el.options[el.selectedIndex];
      if (opt && opt.text) return opt.text.trim();
    }
    if (el.value) return String(el.value).trim();
  }
  return '';
}

// =========================================================================
// 3. TIMER (NÃO CONHECE DOM)
// =========================================================================

function startReviewTimer(initialSeconds = null) {
  console.log('[DEBUG_TIMER] 🚀 startReviewTimer chamado com initialSeconds:', initialSeconds);
  console.log('[DEBUG_TIMER] Estado atual do timer:', ReviewState.timer_state);
  
  // Evita iniciar se já estiver rodando
  if (ReviewState.timer_state === TIMER_STATE.RUNNING) {
    console.log('[DEBUG_TIMER] ⚠️ Timer já está rodando. Abortando.');
    return;
  }

  // Aplica tempo inicial (ex: vindo do backend)
  if (typeof initialSeconds === 'number' && initialSeconds >= 0) {
    ReviewState.tempo_total_seg = initialSeconds;
    UI.updateTimerDisplay(ReviewState.tempo_total_seg);
    console.log('[DEBUG_TIMER] ✅ Tempo inicial definido:', initialSeconds, 'segundos');
  }

  // 🔒 Segurança: garante que não existe intervalo anterior
  if (ReviewState.interval) {
    console.log('[DEBUG_TIMER] 🔒 Limpando intervalo anterior');
    clearInterval(ReviewState.interval);
    ReviewState.interval = null;
  }

  ReviewState.timer_state = TIMER_STATE.RUNNING;
  console.log('[DEBUG_TIMER] ✅ Estado do timer definido para RUNNING');

  // 🎯 Mostrar elemento de status completamente
  const reviewStatusEl = document.getElementById('reviewStatus');
  if (reviewStatusEl) {
    reviewStatusEl.removeAttribute('hidden');
    reviewStatusEl.style.display = 'flex';
    reviewStatusEl.style.opacity = '1';
    reviewStatusEl.style.visibility = 'visible';
    console.log('[DEBUG_TIMER] ✅ reviewStatus mostrado com display flex');
  }

  ReviewState.interval = setInterval(() => {
    if (ReviewState.timer_state === TIMER_STATE.RUNNING) {
      ReviewState.tempo_total_seg++;
      UI.updateTimerDisplay(ReviewState.tempo_total_seg);
      if (ReviewState.tempo_total_seg % 10 === 0) {
        console.log('[DEBUG_TIMER] ⏱️ Timer em', ReviewState.tempo_total_seg, 'segundos');
      }
    }
  }, 1000);
  
  console.log('[DEBUG_TIMER] ✅ setInterval criado com ID:', ReviewState.interval);
}

const TimerAudit = {
  events: [],
  lastEventTs: null,

  log(eventName) {
    const now = new Date().toISOString();
    let duration = 0;

    if (this.lastEventTs) {
      duration = Math.floor(
        (new Date(now) - new Date(this.lastEventTs)) / 1000
      );
    }

    this.events.push({
      event: eventName,
      timestamp: now,
      duracao_seg: duration
    });

    this.lastEventTs = now;
  },

  getLogs() {
    return this.events.map(e => ({
      event: e.event,
      timestamp: e.timestamp,
      duracao_seg: e.duracao_seg
    }));
  }
};

function pauseReviewTimer() {
  if (ReviewState.timer_state !== TIMER_STATE.RUNNING) return;
  ReviewState.timer_state = TIMER_STATE.PAUSED;
  TimerAudit.log('PAUSE');
}

function resumeReviewTimer() {
  if (ReviewState.timer_state !== TIMER_STATE.PAUSED) return;
  ReviewState.timer_state = TIMER_STATE.RUNNING;
  TimerAudit.log('RESUME');
}

function stopReviewTimer() {
  clearInterval(ReviewState.interval);
  ReviewState.interval = null;
  ReviewState.timer_state = TIMER_STATE.STOPPED;
}

function finalizeTimer() {
  if (ReviewState.timer_state === TIMER_STATE.RUNNING) {
    pauseReviewTimer();
  }
  TimerAudit.log('END_REVIEW');
  return ReviewState.tempo_total_seg;
}

            if (pauseIcon) pauseIcon.textContent = '⏸️';

            if (statusIndicator) statusIndicator.style.color = '#28a745';
            if (statusLabel) statusLabel.textContent = 'REVISÃO EM ANDAMENTO';
        }
    },

    // ✅ OTIMIZADO: showToast com debounce + ElementCache
    showToast: Utils.debounce(function(msg, color) {
        const t = ElementCache.toast;
        if (!t) return;
        t.style.background = color || '#16a34a';
        t.textContent = String(msg || '');
        t.classList.add('show');
        clearTimeout(t._hideT);
        t._hideT = setTimeout(() => t.classList.remove('show'), CONFIG.TOAST_DURATION);
    }, 300),

    showLoader(on) {
        const l = ElementCache.loader;
        if (this._externalLoaderManaged && on === false) return;
        if (l) l.style.display = on ? 'flex' : 'none';
    },
    setLoaderManagedExternally(flag) { this._externalLoaderManaged = !!flag; },
    setProgress(p) {
        const wrap = document.getElementById('progressWrap');
        const bar = document.getElementById('progressBar');
        if (!wrap || !bar) return;
        const pct = Math.max(0, Math.min(100, Number(p) || 0));
        bar.style.width = `${pct}%`;
        if (pct === 0) wrap.style.display = 'none';
        else if (pct >= 100) {
            wrap.style.display = 'block';
            setTimeout(() => { wrap.style.display='none'; bar.style.width='0%'; }, CONFIG.PROGRESS_HIDE_DELAY);
        } else wrap.style.display='block';
    },
    getEl(id) { return document.getElementById(id); }
};

  if (typeof window !== 'undefined') {
    window.showToast = (msg, color) => UI.showToast(msg, color);

// =========================================================================
// 4. VALIDATION
// =========================================================================
const Validation = {
    validateFileSize(file) {
        if (!file) return { valid:false, error:'❌ Nenhum arquivo selecionado.' };
    if (file.size > CONFIG.MAX_FILE_SIZE_HARD) {
      const maxMB = (CONFIG.MAX_FILE_SIZE_HARD/1024/1024).toFixed(0);
      return { valid:false, error:`❌ Arquivo extremamente grande (${(file.size/1024/1024).toFixed(1)}MB). Máximo ${maxMB}MB.` };
    }
    if (file.size > CONFIG.MAX_FILE_SIZE_WARN) {
      return {
        valid:true,
        warn:true,
        message:`⚠️ Foto grande (${(file.size/1024/1024).toFixed(1)}MB). Otimizando automaticamente...`
      };
        }
        return { valid:true };
    },
    validateFileType(file) {
        if (!file) return { valid:false, error:'❌ Nenhum arquivo selecionado.' };
        const mime = file.type.toLowerCase();
        const isAllowed = CONFIG.ALLOWED_MIME_TYPES.includes(mime) || CONFIG.ALLOWED_MIME_TYPES.some(m=>file.name.toLowerCase().endsWith(m.split('/')[1]));
        if (!isAllowed) return { valid:false, error:'❌ Formato não suportado. Use JPEG ou PNG.' };
        return { valid:true };
    },
    validatePositiveNumber(v, field='Campo') {
        const n = Number(v);
        if (isNaN(n) || n < 0) return { valid:false, error:`❌ ${field} deve ser número >=0` };
        return { valid:true, value:n };
    },
    validateRequired(el, name) {
        if (!el) return { valid:false, error:`❌ Campo "${name}" não encontrado.` };
        const v = String(el.value || '').trim();
        if (!v) return { valid:false, error:`❌ "${name}" é obrigatório.` };
        return { valid:true };
    },
    validateMaxLength(v, max, name) {
        if (String(v).length > max) return { valid:false, error:`❌ "${name}" excede ${max} caracteres.` };
        return { valid:true };
    }
};

// =========================================================================
// 5. STATE
// =========================================================================
const State = {
    defects: [],
    nextId: 1,
    addDefect(d) {
        d = Utils.toSnakeCaseObject(d);
        if (this.defects.length >= CONFIG.MAX_DEFECTS) { UI.showToast(`Máx ${CONFIG.MAX_DEFECTS} defeitos`, '#ef4444'); return false; }
        this.defects.push({ ...d, id:this.nextId++, foto_id:d.foto_id||(d.foto_base64?'[PENDING_NEW]':'') });
        return true;
    },
    removeDefect(i) { if(i>=0 && i<this.defects.length) this.defects.splice(i,1); },
    clearDefects() { this.defects=[]; this.nextId=1; },
    updateDefect(id, up) { const d=this.defects.find(x=>x.id===id); if(d){ Object.assign(d, Utils.toSnakeCaseObject(up)); } }
};

// =========================================================================
// 6. FILE HANDLER (OTIMIZADO PARA LOW-END)
// =========================================================================
const FileHandler = {
    // Cache para imagens processadas
    _imageCache: new Map(),
    // ✅ OTIMIZADO: Limite de cache por tamanho total (previne crashes)
    _cacheMaxSize: 20 * 1024 * 1024, // 20MB máximo
    _currentCacheSize: 0,
    
    _estimateDataUrlBytes(dataUrl) {
      if (!dataUrl) return 0;
      const base64 = String(dataUrl).split(',')[1] || '';
      return Math.floor((base64.length * 3) / 4);
    },

    // Reduz tamanho de imagem para mobile
    async resizeImage(dataUrl, maxWidth = 800, maxHeight = 600, quality = 0.7) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                let { width, height } = img;
                
                // Calcular novo tamanho mantendo proporção
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width *= ratio;
                    height *= ratio;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = dataUrl;
        });
    },
    
    async fileToDataURL(file) {
        if (!file) return Promise.reject(new Error('Nenhum arquivo'));
        
        // Validar arquivo
        const sizeValidation = Validation.validateFileSize(file);
        if (!sizeValidation.valid) return Promise.reject(new Error(sizeValidation.error));
      if (sizeValidation.warn && sizeValidation.message && typeof UI !== 'undefined' && UI.showToast) {
        UI.showToast(sizeValidation.message, '#f59e0b');
      }
        
        const typeValidation = Validation.validateFileType(file);
        if (!typeValidation.valid) return Promise.reject(new Error(typeValidation.error));
        
        // Verificar cache
        const cacheKey = `${file.name}_${file.size}_${file.lastModified}`;
        if (this._imageCache.has(cacheKey)) {
            return Promise.resolve(this._imageCache.get(cacheKey));
        }
        
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    let dataUrl = e.target.result;
                    
                // Reduzir imagem com estratégia adaptativa (sem bloquear produção)
                if (file.size > 8 * 1024 * 1024) {
                  dataUrl = await this.resizeImage(dataUrl, 1280, 960, 0.55);
                } else if (file.size > 4 * 1024 * 1024) {
                  dataUrl = await this.resizeImage(dataUrl, 1600, 1200, 0.6);
                } else if (file.size > 2 * 1024 * 1024) {
                  dataUrl = await this.resizeImage(dataUrl, 1920, 1440, 0.68);
                }

                // Segunda passada se ainda estiver grande para upload estável
                const optimizedBytes = this._estimateDataUrlBytes(dataUrl);
                if (optimizedBytes > CONFIG.MAX_UPLOAD_BASE64_SIZE) {
                  dataUrl = await this.resizeImage(dataUrl, 1024, 768, 0.5);
                    }
                    
                    // ✅ OTIMIZADO: Limite por tamanho total ao invés de contagem
                const dataSize = this._estimateDataUrlBytes(dataUrl);
                    if (this._currentCacheSize + dataSize > this._cacheMaxSize) {
                        this.clearCache(); // Limpar tudo se não couber
                        this._currentCacheSize = 0;
                    }
                    this._imageCache.set(cacheKey, dataUrl);
                    this._currentCacheSize += dataSize;
                    
                    resolve(dataUrl);
                } catch (err) {
                    reject(err);
                }
            };
            reader.onerror = () => reject(new Error('Erro leitura arquivo'));
            reader.readAsDataURL(file);
        });
    },
    
    parseDataURL(dataUrl) {
        if (!dataUrl) return null;
        const m = String(dataUrl).match(/^data:(image\/[0-9a-zA-Z.+-]+)(?:;charset=[^;]+)?;base64,(.*)$/);
        return m ? { mimeType: m[1], base64: m[2] } : null;
    },
    
    // Limpar cache para liberar memória
    clearCache() {
        this._imageCache.clear();
        this._currentCacheSize = 0;
    }
};

// =========================================================================
// 7. SERVER
// =========================================================================
const Server = {
    isAvailable(){ return typeof google !== 'undefined' && google.script && typeof google.script.run === 'object'; },
    
    async call(functionName, payload = null) {
        // ========================================================= //
        // OFFLINE MODE: Check if offline and queue data
        // ========================================================= //
        if (!navigator.onLine && window.OfflineManager) {
            console.log('[OFFLINE] 📦 Queueing offline request:', functionName);
            
            // Queue the data for later sync
            const queueData = {
                functionName: functionName,
                payload: payload || {}
            };
            
            try {
                await window.OfflineManager.queueData(functionName, queueData, 'POST');
                
                // Update queue indicator
                const queueElement = document.getElementById('offline-queue-count');
                if (queueElement) {
                    const count = window.OfflineManager.getQueueLength?.() || 0;
                    queueElement.textContent = `${count} itens na fila`;
                }
                
                // Show toast notification
                if (window.showToast) {
                    showToast('📤 Solicitação enfileirada. Será sincronizada quando reconectar.');
                }
            } catch (err) {
                console.error('[OFFLINE] ❌ Queue error:', err);
            }
            
            return new Promise((res, rej) => {
                rej(new Error('Você está offline. A solicitação foi enfileirada e será enviada quando reconectar.'));
            });
        }
        
        // ========================================================= //
        // ONLINE MODE: Normal server call
        // ========================================================= //
        if(!this.isAvailable()) throw new Error('Serviço Google indisponível');
        
        return new Promise((res, rej) => {
            const runner = google.script.run
                .withSuccessHandler(r => {
                  // Se o retorno for nulo, rejeita.
                  if (!r) return rej(new Error(`${functionName} retornou vazio.`));
                    
                  // Se o retorno tiver status, valida o status.
                  // Aceitar também respostas com status 'OK' (compatibilidade servidor)
                  if (r.hasOwnProperty('status')) {
                    if (r.status === 'SUCESSO' || r.status === 'PENDENTE' || r.status === 'OK') {
                      res(r);
                    } else {
                      rej(new Error(r.message || `${functionName} falhou.`));
                    }
                  } else {
                    // Funções de consulta simples (ex: checkActiveRoll)
                    res(r);
                  }
                })
                .withFailureHandler(e => {
                    console.error(`[SERVER ERR] ${functionName}:`, e);
                    rej(e || new Error(`Falha na comunicação com o servidor.`));
                });

            // Chama a função no backend (com ou sem payload)
            if (payload !== null) {
                runner[functionName](payload);
            } else {
                runner[functionName]();
            }
        });
    },

    // Atalhos
    async checkActiveRoll(responsavel) { return this.call('checkActiveRoll', responsavel); },
    initializeRoll(payload) { return this.call('initializeRollAndGetId', payload); },
    uploadDefectPhoto(payload) { return this.call('uploadDefectPhoto', payload); },
    processRRT(data) { return this.call('processarRRT_Web', data); },
    saveStructuredData(payload) { return this.call('insertStructuredData', payload); }
};

// =========================================================================
// 8. DEFECT MANAGER (OTIMIZADO PARA MOBILE)
// =========================================================================
const DefectManager = {
    // Cache para elementos renderizados
    _renderCache: new Map(),
    // ✅ OTIMIZADO: Um IntersectionObserver global ao invés de um por imagem
    _imageObserver: null,
    // ✅ NOVO: Rastrear última contagem para evitar re-render desnecessário
    _lastDefectCount: 0,
    
    initImageObserver() {
        if (this._imageObserver) return; // Evitar duplicata
        
        if ('IntersectionObserver' in window) {
            // ✅ OTIMIZADO: threshold mínimo (1%) e rootMargin para preload suave
            this._imageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const src = entry.target.dataset.src;
                        if (src && entry.target.src !== src) {
                            entry.target.src = src;
                            this._imageObserver.unobserve(entry.target); // Parar de observar
                        }
                    }
                });
            }, { threshold: 0.01, rootMargin: '50px' }); // 1% visible + 50px antecedência
        }
    },
    
    // Lazy loading para imagens (agora usa observer global)
    _loadImageLazy(img, src) {
        if (!src) return;
        
        // Usar observer global
        if ('IntersectionObserver' in window && this._imageObserver) {
            img.dataset.src = src;
            this._imageObserver.observe(img);
        } else {
            // Fallback para browsers mais antigos
            setTimeout(() => img.src = src, 100);
        }
    },
    
    // Otimizado: render com throttling MAIS conservador (100ms → 500ms para evitar excesso de renders)
    render: Utils.throttle(function() {
        const list = UI.getEl('defect-list'); 
        if (!list) return;
        
        // ✅ OTIMIZADO: Evitar re-render se número de defeitos não mudou
        if (State.defects.length === this._lastDefectCount && this._renderCache.size > 0) {
            return; // Nada mudou, pular re-render
        }
        this._lastDefectCount = State.defects.length;
        
        // ✅ Limpar cache se cresceu demais (LRU - evita memory leak)
        if (this._renderCache.size > CONFIG.MAX_RENDER_CACHE) {
            const firstKey = this._renderCache.keys().next().value;
            this._renderCache.delete(firstKey);
        }
        
        // Usar DocumentFragment para melhor performance
        const fragment = document.createDocumentFragment();
        
        State.defects.forEach((d, idx) => {
            const cacheKey = `defect_${d.id}_${idx}`;
            let card = this._renderCache.get(cacheKey);
            
            if (!card) {
                card = this._createDefectCard(d, idx);
                this._renderCache.set(cacheKey, card);
            } else {
                // Atualizar apenas dados dinâmicos
                this._updateDefectCard(card, d, idx);
            }
            
            fragment.appendChild(card);
        });
        
        list.innerHTML = '';
        list.appendChild(fragment);
    }, 500), // ✅ OTIMIZADO: 100ms → 500ms (reduzir redraw de defeitos)
    
    _createDefectCard(d, idx) {

        card.className = 'defect-card';

        const imageSrc = d.foto_url || d.foto_base64 || placeholderSvg;
        if (imageSrc !== placeholderSvg) {

        } else {
            img.src = placeholderSvg;
        }
        
        const meta = document.createElement('div');

        const actions = document.createElement('div');

        // Criar botões

        const removeBtn = document.createElement('button');

        removeBtn.addEventListener('click', () => {

    _updateDefectCard(card, d, idx) {

    async handleAddDefect(selTipo, txtTipo, miEl, mfEl, fileEl, zoneEl, gravityEl) {
        let tipo = selTipo?.value || '';
        if (String(tipo || '').toLowerCase() === '__outro__') tipo = txtTipo?.value?.trim()?.toUpperCase();
        if (!tipo) { UI.showToast('Informe tipo', '#f59e0b'); return; }

        const miCheck = Validation.validatePositiveNumber(miEl?.value, 'Metro inicial');
        const mfCheck = Validation.validatePositiveNumber(mfEl?.value, 'Metro final');
        if (!miCheck.valid || !mfCheck.valid) { UI.showToast(miCheck.error || mfCheck.error, '#ef4444'); return; }

        let mi = miCheck.value, mf = mfCheck.value;
        if (mi > mf) { [mi, mf] = [mf, mi]; UI.showToast(`Valores invertidos automaticamente: ${mi}m → ${mf}m`, '#f97316'); }

        let zonas = [];
        if (zoneEl?.options) {
            zonas = Array.from(zoneEl.options)
                .filter(o => o.selected)
                .map(o => o.value);
        }

        // Gravidade
        let gravidade = gravityEl?.value || '';
        if (tipo.toUpperCase().includes('FURO') && (mf - mi) >= 1.5) { gravidade = '4'; }

        let dataUrl = '', filename = '';
        const f = fileEl?.files?.[0];
        if (f) {
            try { dataUrl = await FileHandler.fileToDataURL(f); filename = f.name; }
            catch (e) { UI.showToast(e.message || 'Erro foto', '#ef4444'); return; }
        }

        const defect = { tipo, metro_inicial: mi, metro_final: mf, posicao_largura: zonas, gravidade, foto_base64: dataUrl, filename, criado_em: new Date().toISOString() };

        if (State.addDefect(defect)) {
            this.render();
            UI.showToast('Defeito adicionado');
            if (miEl) miEl.value = '';
            if (mfEl) mfEl.value = '';
            if (selTipo) selTipo.value = '';
            if (txtTipo) txtTipo.value = '';
            if (fileEl) fileEl.value = '';
            if (gravityEl) gravityEl.value = '';
            if (typeof resetZoneSelector === 'function') resetZoneSelector();
        }
    },

    async uploadPhoto(defectId, index, btn) {
  const d = State.defects.find(x => x.id === defectId);
  if (!d) throw new Error('Defeito não encontrado');

  // Já enviada com sucesso → não reenviar
  if (d.foto_id && !['[PENDING]', '[PENDING_NEW]', '[FALHA]'].includes(d.foto_id)) {
    return { status: 'JA_ENVIADA', defectId };
  }

  if (!d.foto_base64) {
    throw new Error('Não há imagem para enviar');
  }

  if (!roll_id) {
    throw new Error('ID do Rolo não inicializado');
  }

  if (btn) {
    btn.disabled = true;
    btn.innerText = 'Enviando...';
  }

  // Normalização defensiva do base64
  const parsed = FileHandler.parseDataURL(d.foto_base64);
  const base64 = (parsed && parsed.base64) ? parsed.base64 : d.foto_base64;

  State.updateDefect(defectId, { foto_id: '[PENDING]' });
  DefectManager.render();

  try {
    const payload = {
      foto_base64: base64,
      filename: d.filename || `defeito_${d.id || index}.jpg`,
      nome_defeito: d.tipo || d.nome_defeito || `def_${d.id || index}`,
      id_rolo: roll_id,
      revisor: sel('resp', 'responsavel', 'revisor')
    };

    const res = await Server.uploadDefectPhoto(payload);

    if (res.status === 'SUCESSO') {
      State.updateDefect(defectId, {
        foto_id: res.file_id || '',
        saved_photo_id: res.file_id || '',
        foto_url: res.file_url || '',
        filename: res.filename || d.filename,
        foto_base64: null
      });

      UI.showToast('Foto enviada');
      return res;
    }

    if (res.status === 'PENDENTE') {
      UI.showToast('Foto enfileirada');
      return res;
    }

    throw new Error(res.message || 'Upload retornou status desconhecido');

  } catch (e) {
    State.updateDefect(defectId, { foto_id: '[FALHA]' });
    throw e;

  } finally {
    if (btn) btn.disabled = false;
    DefectManager.render();
  }
},

    async uploadAllPhotos() {
      const photos = State.defects.filter(d => d.foto_base64 && d.foto_id !== '[PENDING]');
      if (photos.length === 0) return;

      UI.showLoader(true);
      UI.showToast(`Enviando ${photos.length} fotos...`);

      const errors = [];

      for (let i = 0; i < photos.length; i++) {
        const defect = photos[i];
        try {
          await this.uploadPhoto(defect.id, i, null);
        } catch (error) {
          errors.push(error);
        }

        UI.setProgress(20 + Math.round(((i + 1) / photos.length) * 30));
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      if (!UI._externalLoaderManaged) UI.showLoader(false);
      DefectManager.render();

      if (errors.length > 0) {
        const msg = errors.map(e => e?.message || 'Erro desconhecido').join('; ');
        throw new Error(`Não foi possível enviar ${errors.length} fotos. ${msg}`);
      }
    },

/**
 * ⚠️ USADO APENAS NO SUBMIT: Mapeia dados brutos para modelo canônico (ÚNICA VERDADE)
 * 
 * Esta função é chamada EXCLUSIVAMENTE em FormManager.handleSubmit()
 * para garantir que apenas nomes canônicos sejam enviados ao backend.
 * 
 * Fora do submit, use FormManager.collectFormData() que mantém compatibilidade legada.
 */
function mapToCanonicalReview(raw) {
    const toFloat = v => {
        if (v === null || v === undefined || v === '') return 0;
        const n = parseFloat(String(v).replace(',', '.'));
        return isNaN(n) ? 0 : n;
    };

    // GARANTIR que localizacao vem de loc (campo do QR)
    const localizacao = raw.localizacao || raw.loc || '';
    const revised_meters_valor = raw.revised_meters || raw.metros_revisado || 0;

    console.log('[CANONICAL] RAW DATA RECEBIDO:', {
        defects_count: (raw.defects || []).length,
        sup_product_id: raw.sup_product_id,
        revised_meters: revised_meters_valor,
        metros_revisado: raw.metros_revisado,
        localizacao_raw: raw.localizacao,
        loc_raw: raw.loc,
        localizacao_final: localizacao,
        est_tc: raw.est_tc,
        len: raw.len,
        wid: raw.wid
    });
    
    // 🔍 DEBUG: Log detalhado para garantir que loc está vindo
    console.log('[CANONICAL] LOCALIZACAO SOURCE CHAIN:',
        'raw.localizacao=' + raw.localizacao,
        '|| raw.loc=' + raw.loc,
        '|| fallback=empty',
        '= FINAL: ' + localizacao
    );

    // Determinar tipo de tecido PRIMEIRO para aplicar fallbacks corretos
    const isMalha = raw.est_tc === 'tc_malha';
    
    // Para PLANO: se revised_meters for 0 (usuário não preencheu), usa wid como fallback
    let metrosRevisados = toFloat(revised_meters_valor);
    if (!isMalha && (!metrosRevisados || metrosRevisados === 0)) {
        metrosRevisados = toFloat(raw.wid) || 0;  // Fallback: usa meters_supplier do QR
        console.log('[CANONICAL] ⚠️ revised_meters estava vazio, usando wid como fallback:', metrosRevisados);
    }

    // Calcular área - usa apenas valores revisados (largura em cm × metros)
    // NOTA: revised_meters = metros revisados (altura do rolo)
    // NOTA: len = largura em cm (do QR)
    const larguraEmCm = toFloat(raw.len) || 0;
    const area_m2 = larguraEmCm && metrosRevisados 
        ? Number(((larguraEmCm / 100) * metrosRevisados).toFixed(2))
        : 0;

    // Determinar valores do fornecedor conforme tipo de tecido
    const larguraFornecedor = toFloat(raw.len) || 0;      // LARGURA FORNECEDOR (cm) - sempre existe
    let metrosFornecedor = 0;    // METROS FORNECEDOR - apenas para tecido plano
    let pesoFornecedor = 0;       // PESO FORNECEDOR - apenas para malha
    
    if (isMalha) {
      // Para malha: wid contém peso em kg
      pesoFornecedor = toFloat(raw.wid) || 0;
      metrosFornecedor = 0; // não se aplica para malha
    } else {
      // Para tecido plano: wid contém metros
      metrosFornecedor = toFloat(raw.wid) || 0;
      pesoFornecedor = toFloat(raw.supplier_weight) || 0; // peso opcional para plano
    }

    // Calcular total de pontos
    const total_pontos = (typeof DefectManager !== 'undefined' && DefectManager.getTotalPoints) 
        ? DefectManager.getTotalPoints() : 0;

    // Mapear defeitos para formato canônico
    const defeitos = (raw.defects || []).map(d => ({
        tipo: d.tipo || d.nome_defeito || '',
        metro_inicial: toFloat(d.metro_inicial),
        metro_final: toFloat(d.metro_final),
        posicao_largura: Array.isArray(d.posicao_largura) 
            ? d.posicao_largura 
            : (d.posicao_largura ? String(d.posicao_largura).split(',').map(s => s.trim()) : []),
        gravidade: d.gravidade || '',
        foto_url: d.foto_url || '',
        foto_id: d.foto_id || '',
        observacoes: d.observacoes || '',
        criado_em: d.criado_em || ''
    }));

    // Retornar modelo canônico (ÚNICA VERDADE)
    return {
        rolo: {
            // IDs canônicos
            review_id: raw.review_id,
            roll_id: raw.roll_id,
            revision_id: raw.review_id,
            id_do_rolo: raw.roll_id,
            
            // REVISOR
            revisor_nome: raw.revisor_nome || sel('resp', 'responsavel', 'revisor') || '',
            
            // FORNECEDOR
            supplier_id: raw.supplier_id || '',
            supplier_nm: raw.supplier_nm || '',
            fornecedor_id: raw.supplier_id || '',
            fornecedor_nome: raw.supplier_nm || '',
            
            // NOTA FISCAL
            nf: raw.nf || '',
            nota_fiscal: raw.nf || '',
            
            // PRODUTO
            product_id: raw.product_id || raw.sup_product_id || '',
            produto_id: raw.product_id || raw.sup_product_id || '',
            
            // PRODUTO_SUP_ID
            sup_product_id: raw.sup_product_id || '',
            produto_sup_id: raw.sup_product_id || '',
            
            // LOTE
            lot: raw.lot || '',
            lote: raw.lot || '',
            
            // COR
            color_id: raw.color_id || '',
            cor: raw.color_id || '',
            
            // LOCALIZACAO (CRÍTICO! Agora com fallback duplo)
            loc: localizacao,
            localizacao: localizacao,
            
            // ESTRUTURA
            est_tc: raw.est_tc || '',
            estrutura_tecido: raw.est_tc || '',
            
            // TIPO TECIDO
            tipo_tecido: isMalha ? 'MALHA' : 'PLANO',
            
            // LARGURA
            len: larguraEmCm,
            largura_cm: larguraEmCm,
            
            // METROS REVISADOS (CRÍTICO! Sem fallback para zero)
            metros_revisado: isMalha ? 0 : metrosRevisados,
            revised_meters: isMalha ? 0 : metrosRevisados,
            
            // PESO
            peso_kg: isMalha ? pesoFornecedor : 0,
            
            // METROS FORNECEDOR
            wid: toFloat(raw.wid) || 0,
            metros_fornecedor: toFloat(raw.wid) || 0,
            
            // AREA
            area_m2: isMalha ? 0 : area_m2,
            
            // OUTROS
            fabric_pattern: raw.fabric_pattern || '',
            padronagem: raw.fabric_pattern || '',
            comp: raw.comp || '',
            composicao: raw.comp || '',
            
            // STATUS
            status_rolo: raw.status_rolo || '',
            status_final: raw.status_rolo || '',
            observacoes: raw.observacoes || '',
            declaracao: raw.declaracao || 'NÃO CIENTE',
            
            // TEMPO E PONTOS
            tempo_total_seg: raw.tempo_total_seg || 0,
            total_pontos: total_pontos
        },
        
        defeitos: defeitos,
        
        fotos: (typeof DefectManager !== 'undefined') 
            ? DefectManager.getUploadedPhotos().map(f => ({ 
                foto_url: String(f), 
                review_id: raw.review_id 
            })) 
            : [],
        
        tempos: (typeof TimerAudit !== 'undefined') ? TimerAudit.getLogs() : []
    };
}

function initializeZoneSelector() {
  const selectElement = UI.getEl('input_posicao_largura');
  const zoneButtons = document.querySelectorAll('.zone-model-visual .zone-button');
  if(!selectElement || zoneButtons.length === 0) return;
  
  function syncSelectToButtons() {
    const selected = Array.from(selectElement.options)
      .filter(o => o.selected)
      .map(o => o.value);
    zoneButtons.forEach(btn => {
      const v = btn.getAttribute('data-value');
      btn.classList.toggle('active', selected.includes(v));
    });
  }
  
  function syncButtonsToSelect() {
    const selectedValues = Array.from(zoneButtons)
      .filter(b => b.classList.contains('active'))
      .map(b => b.getAttribute('data-value'));
    Array.from(selectElement.options).forEach(opt => {
      opt.selected = selectedValues.includes(opt.value);
    });
    selectElement.dispatchEvent(new Event('change'));
  }
  
  zoneButtons.forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      btn.classList.toggle('active');
      syncButtonsToSelect();
    });
  });
  
  syncSelectToButtons();
}

function resetZoneSelector() {
  const selectElement = UI.getEl('input_posicao_largura');
  const zoneButtons = document.querySelectorAll('.zone-model-visual .zone-button');
  if(selectElement) {
    Array.from(selectElement.options).forEach(opt => opt.selected = false);
    selectElement.dispatchEvent(new Event('change'));
  }
  zoneButtons.forEach(btn => btn.classList.remove('active'));
}

    async initializeRRT(parsedQrData) {
  if (review_id) {
    console.log('[FLOW] ⚠️ review_id já definido. Abortando inicialização duplicada.');
    return;
  }
  if (!Server.isAvailable()) {
    console.log('[SERVER_COMM] ⚠️ Servidor não disponível. Abortando.');
    return;
  }

  console.log('[FLOW] ========== INICIANDO RRT ==========');
  console.log('[FLOW] parsedQrData recebido:', JSON.stringify(parsedQrData).substring(0, 150) + '...');

  UI.showLoader(true);
  FormManager._setFormEnabled(false);

  try {
    const revisorNome =
      (parsedQrData && parsedQrData.revisorNome) ||
      sel('resp', 'responsavel', 'revisor') ||
      'Revisor Teste';

    const qrPayload = (parsedQrData && parsedQrData.qrData) || parsedQrData || null;

    console.log('[FLOW] Disparando Server.initializeRoll({ revisorNome, qrData })');
    const response = await Server.initializeRoll({ revisorNome, qrData: qrPayload });

    console.log('[SERVER_COMM] Resposta bruta do servidor:', JSON.stringify(response));

    // ✅ AGORA O SUCESSO DEPENDE DO review_id (NÃO do roll_id)
    if (response.status === 'SUCESSO' && response.review_id) {

      console.log('[SERVER_COMM] ✅ SUCESSO: review_id =', response.review_id, '| roll_id =', response.roll_id);

      // 🔑 IDs canônicos
      review_id = response.review_id;
      roll_id   = response.roll_id || null;

      if (typeof window !== 'undefined') {
        window.RRT_REVIEW_ID = review_id;
        window.RRT_ROLL_ID = roll_id;
      }

      // Só preenche campo de rolo se existir
      const idEl = UI.getEl('id_do_rolo');
      if (idEl && roll_id) idEl.value = String(roll_id);

      UI.showToast('✅ Revisão iniciada com ID: ' + review_id, '#22c55e');

      // ✨ LIBERA O FORMULÁRIO
      FormManager._setFormEnabled(true);

      revisor_nome =
        response.opened_by ||
        response.revisorNome ||
        response.revisor ||
        revisorNome ||
        null;

      console.log('[FLOW] revisor_nome definido como:', revisor_nome);

      // -------- UI de status --------
      const reviewStatusEl = UI.getEl('reviewStatus');
      console.log('[DEBUG_UI] reviewStatusEl encontrado?', !!reviewStatusEl);
      if (reviewStatusEl) {
        console.log('[DEBUG_UI] reviewStatusEl.hidden antes:', reviewStatusEl.hidden);
        reviewStatusEl.hidden = false;
        reviewStatusEl.style.display = 'flex';
        console.log('[DEBUG_UI] reviewStatusEl.hidden depois:', reviewStatusEl.hidden);
        console.log('[DEBUG_UI] reviewStatusEl.style.display:', reviewStatusEl.style.display);
      }

      const statusLabel = UI.getEl('statusLabel');
      if (statusLabel) statusLabel.textContent = 'REVISÃO EM ANDAMENTO';

      const statusIndicator = UI.getEl('statusIndicator');
      if (statusIndicator) statusIndicator.style.color = '#28a745';

      const reviewTimerEl = UI.getEl('reviewTimer');
      console.log('[DEBUG_UI] reviewTimerEl encontrado?', !!reviewTimerEl);
      if (reviewTimerEl) {
        reviewTimerEl.style.display = 'inline-block';
        console.log('[DEBUG_UI] reviewTimerEl.textContent inicial:', reviewTimerEl.textContent);
      }

      // -------- TIMER --------
      console.log('[FLOW]  Iniciando cronômetro...');
      try {
        let initialSeconds = 0;

        if (typeof response.elapsed_seconds === 'number') {
          initialSeconds = response.elapsed_seconds;
        } else if (response.started_at) {
          const started = new Date(response.started_at);
          if (!isNaN(started)) {
            initialSeconds = Math.floor((Date.now() - started.getTime()) / 1000);
          }
        }

        console.log('[DEBUG_TIMER] Chamando startReviewTimer com', initialSeconds, 'segundos');
        startReviewTimer(initialSeconds);
        TimerAudit.log('START_REVIEW');
        console.log('[UI_STATE] ⏱️ Timer iniciado com', initialSeconds, 'segundos');
        console.log('[DEBUG_TIMER] ReviewState.timer_state após start:', ReviewState.timer_state);
        console.log('[DEBUG_TIMER] ReviewState.interval após start:', ReviewState.interval);
      } catch (e) {
        console.error('[UI_STATE] ERRO ao iniciar timer:', e);
        console.error('[UI_STATE] Stack:', e.stack);
      }

      // -------- LIMPEZA VISUAL --------
      const btnScanQr = UI.getEl('btnScanQr');
      if (btnScanQr) btnScanQr.style.display = 'none';

      const startOverlay = UI.getEl('startOverlay');
      if (startOverlay) { startOverlay.style.display = 'none'; console.log('[UI_STATE] startOverlay ocultado'); }

      console.log('[FLOW] ========== RRT INICIALIZADO COM SUCESSO ==========');

    } else {
      const errMsg = response.message || 'Falha ao iniciar revisão - resposta inválida do servidor';
      console.error('[SERVER_COMM] ❌ ERRO: Resposta inválida:', response);
      throw new Error(errMsg);
    }

  } catch (e) {
    console.error('[SERVER_COMM] ❌ ERRO CRÍTICO ao inicializar RRT:', e.message);
    console.error('[SERVER_COMM] Stack:', e.stack);
    UI.showToast('❌ Erro: ' + (e.message || 'desconhecido'), '#ef4444');

    // Reset canônico em caso de falha
    review_id = null;
    roll_id = null;

  } finally {
    UI.showLoader(false);
    console.log('[FLOW] showLoader(false) - UI liberada');
  }
},

  async handleQrScanFlow(){
    console.log('[QR_SCAN] 🚀 Iniciando handleQrScanFlow no App');
    
    try {
      // Verificar se já existe uma revisão em andamento
      if (review_id) {
        console.log('[QR_SCAN] ⚠️ Já existe uma revisão ativa. Abortando.');
        UI.showToast('Já existe uma revisão em andamento', '#f59e0b');
        return;
      }

      // Verificar se o responsável foi selecionado
      const respSelect = UI.getEl('resp');
      const selectedRevisor = respSelect && respSelect.selectedIndex > 0 ? respSelect.options[respSelect.selectedIndex].text : null;
      
      console.log('[QR_SCAN] 👤 Revisor selecionado:', selectedRevisor);
      
      if (!selectedRevisor || selectedRevisor === 'Selecionar') {
        console.log('[QR_SCAN] ❌ Nenhum revisor selecionado');
        UI.showToast('Por favor, selecione um responsável antes de escanear o QR Code', '#ef4444');
        return;
      }

      // Solicitar ao usuário para escanear o QR Code
      console.log('[QR_SCAN] 📷 Solicitando leitura do QR Code via câmera');
      
      let qrInput;
      
      try {
        await ensureReviewerScannerLoaded();
        // Tentar usar a câmera primeiro
        qrInput = await scanQrFromCamera();
        console.log('[QR_SCAN] ✅ QR Code capturado via câmera');
      } catch (cameraError) {
        let errorMsg = 'Câmera não disponível';
        switch (cameraError.name) {
          case 'NotAllowedError':
          case 'PermissionDeniedError':
            errorMsg = 'Você bloqueou o acesso à câmera. Permita em configurações do navegador.';
            break;
          case 'NotFoundError':
          case 'DevicesNotFoundError':
            errorMsg = 'Nenhuma câmera encontrada no dispositivo.';
            break;
          case 'NotReadableError':
          case 'TrackStartError':
            errorMsg = 'A câmera está em uso por outro aplicativo. Feche e tente novamente.';
            break;
          case 'OverconstrainedError':
          case 'ConstraintNotSatisfiedError':
            errorMsg = 'Câmera não atende aos requisitos técnicos mínimos.';
            break;
          case 'TypeError':
            errorMsg = 'Navegador não suporta acesso à câmera.';
            break;
          default:
            if (cameraError.message.includes('CDN') || cameraError.message.includes('CORS')) {
              errorMsg = 'Falha ao carregar bibliotecas QR (CORS/CDN bloqueado).';
            } else if (cameraError.message.includes('Timeout')) {
              errorMsg = 'Timeout ao carregar scanner. Tente novamente.';
            } else if (cameraError.message.includes('Cancelado')) {
              errorMsg = 'Leitura de QR cancelada.';
              return;
            }
        }

        console.error('[QR_SCAN] 💥 Falha ao abrir scanner QR:', cameraError);
        UI.showToast(`⚠️ ${errorMsg} Use o botão “Preencher Manualmente” se necessário.`, '#f59e0b');
        return;
      }

      console.log('[QR_SCAN] 📝 QR Code recebido:', qrInput.substring(0, 50) + '...');

      // Parse do QR Code (tolerante)
      const parsedQrData = this.parseQrPayload(qrInput);
      if (parsedQrData) {
        console.log('[QR_SCAN] ✅ QR Code parseado com sucesso:', parsedQrData);
      } else {
        console.warn('[QR_SCAN] ⚠️ QR lido, mas sem mapeamento completo de campos. Seguindo com inicialização.');
      }

      // Preparar dados para inicialização
      const payload = {
        revisorNome: selectedRevisor,
        qrData: parsedQrData || qrInput
      };

      console.log('[QR_SCAN] 🔄 Chamando initializeRRT com payload:', payload);

      // Produção: preenche imediatamente para não depender do backend.
      if (parsedQrData) {
        this.applyQrDataToForm(parsedQrData);
        this.lockPrefilledFields();
      }

      // Inicializar a revisão
      await this.initializeRRT(payload);

      // ✅ AGORA: Preencher campos apenas se payload for reconhecido
      if (parsedQrData) {
        console.log('[QR_SCAN] 📝 Preenchendo campos do formulário...');
        this.applyQrDataToForm(parsedQrData);
        this.lockPrefilledFields();
      } else {
        UI.showToast('QR lido. Complete os campos que não foram reconhecidos.', '#f59e0b');
      }
      
      console.log('[QR_SCAN] 🎉 Fluxo de QR Code concluído com sucesso');
      
    } catch (error) {
      console.error('[QR_SCAN] 💥 ERRO no handleQrScanFlow:', error);
      console.error('[QR_SCAN] 📋 Stack trace:', error.stack);
      
      // Se o erro for relacionado a falta de revisor, armazenar QR data para uso posterior
      if (error.message && error.message.includes('Revisor inválido')) {
        console.log('[QR_SCAN] 💾 Armazenando QR data para uso posterior');
        ReviewState.pending_qr_data = qrInput;
        UI.showToast('Selecione um responsável para continuar', '#f59e0b');
      } else {
        UI.showToast('Erro ao processar QR Code: ' + error.message, '#ef4444');
      }
      
      throw error;
    }
  },

  parseQrPayload(raw){
    console.log('[QR_PARSE] 📊 Iniciando parse de QR:', raw.substring(0, 100) + (raw.length > 100 ? '...' : ''));
    
    const text = String(raw || '').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
    if (!text) {
      console.warn('[QR_PARSE] ❌ QR vazio');
      return null;
    }

    const normalizeKey = (k) => String(k || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');

    const aliasToCanonical = {
      supplier_id: ['supplier_id', 'fornecedor_id', 'id_fornecedor', 'idfornecedor', 'id_forn', 'forn_id'],
      supplier_name: ['supplier_name', 'supplier_nm', 'fornecedor', 'fornecedor_nome', 'nome_fornecedor', 'forn_nome'],
      nf: ['nf', 'nota_fiscal', 'nota', 'nota_fiscal_numero'],
      product_id: ['product_id', 'produto_id', 'codigo_produto', 'cod_produto', 'cod_prod', 'produto'],
      lot: ['lot', 'lote', 'lote_id'],
      sup_product_id: ['sup_product_id', 'produto_sup_id', 'supplier_product_id', 'produto_fornecedor_id'],
      color_id: ['color_id', 'cor', 'color', 'cor_id'],
      fabric_pattern: ['fabric_pattern', 'padronagem', 'pattern', 'desenho'],
      loc: ['loc', 'localizacao', 'local', 'endereco', 'rua', 'posicao'],
      meters_supplier: ['meters_supplier', 'metros_fornecedor', 'metros', 'metragem', 'wid'],
      wid: ['wid', 'largura', 'len', 'largura_cm'],
      comp: ['comp', 'composicao', 'composition']
    };

    const canonicalByAlias = Object.create(null);
    Object.keys(aliasToCanonical).forEach((canonical) => {
      aliasToCanonical[canonical].forEach((alias) => {
        canonicalByAlias[normalizeKey(alias)] = canonical;
      });
    });

    const numberFrom = (value) => {
      const normalized = String(value || '')
        .replace(/\s/g, '')
        .replace(',', '.')
        .replace(/[^0-9.-]/g, '');
      const parsed = parseFloat(normalized);
      return Number.isFinite(parsed) ? parsed : 0;
    };

    const buildCanonical = (payload = {}) => {
      const normalizedPayload = {};
      Object.keys(payload || {}).forEach((k) => {
        const canonicalKey = canonicalByAlias[normalizeKey(k)] || normalizeKey(k);
        if (canonicalKey && normalizedPayload[canonicalKey] === undefined) {
          normalizedPayload[canonicalKey] = payload[k];
        }
      });

      const data = {
        supplier_id: normalizedPayload.supplier_id || '',
        supplier_name: normalizedPayload.supplier_name || '',
        nf: normalizedPayload.nf || '',
        product_id: normalizedPayload.product_id || '',
        lot: normalizedPayload.lot || '',
        sup_product_id: normalizedPayload.sup_product_id || '',
        color_id: normalizedPayload.color_id || '',
        fabric_pattern: normalizedPayload.fabric_pattern || '',
        loc: normalizedPayload.loc || '',
        meters_supplier: numberFrom(normalizedPayload.meters_supplier),
        wid: numberFrom(normalizedPayload.wid),
        comp: normalizedPayload.comp || ''
      };

      const hasMinimum = Object.values(data).some(v => String(v || '').trim() !== '' && String(v || '') !== '0');
      return hasMinimum ? data : null;
    };

    // 1) JSON
    if ((text.startsWith('{') && text.endsWith('}')) || (text.startsWith('[') && text.endsWith(']'))) {
      try {
        console.log('[QR_PARSE] 🔍 Tentando formato JSON...');
        const parsedJson = JSON.parse(text);
        if (Array.isArray(parsedJson) && parsedJson.length >= 11) {
          const parts = parsedJson.map(v => String(v || '').trim());
          const result = {
            supplier_id: parts[0] || '',
            supplier_name: parts[1] || '',
            nf: parts[2] || '',
            product_id: parts[3] || '',
            lot: parts[4] || '',
            sup_product_id: parts[5] || '',
            color_id: parts[6] || '',
            fabric_pattern: parts[7] || '',
            loc: parts[8] || '',
            meters_supplier: numberFrom(parts[9]),
            wid: numberFrom(parts[10]),
            comp: parts.slice(11).join(' ').trim()
          };
          console.log('[QR_PARSE] ✅ JSON array parseado com sucesso');
          return result;
        }

        const canonicalFromJson = buildCanonical(parsedJson || {});
        if (canonicalFromJson) {
          console.log('[QR_PARSE] ✅ JSON object parseado com sucesso');
          return canonicalFromJson;
        }
      } catch (e) {
        console.warn('[QR_PARSE] ⚠️ Falha ao parsear JSON:', e.message);
      }
    }

    // 2) URL com query params
    if (/^https?:\/\//i.test(text)) {
      try {
        console.log('[QR_PARSE] 🔍 Tentando formato URL...');
        const url = new URL(text);
        const params = Object.fromEntries(url.searchParams.entries());
        const canonicalFromUrl = buildCanonical(params);
        if (canonicalFromUrl) {
          console.log('[QR_PARSE] ✅ URL parseada com sucesso');
          return canonicalFromUrl;
        }
      } catch (e) {
        console.warn('[QR_PARSE] ⚠️ Falha ao parsear URL:', e.message);
      }
    }

    // 3) key=value / key:value em linhas
    if (/[:=]/.test(text) && /\r?\n/.test(text)) {
      console.log('[QR_PARSE] 🔍 Tentando formato key=value multilinhas...');
      const kv = {};
      text.split(/\r?\n/).forEach(line => {
        const trimmed = String(line || '').trim();
        if (!trimmed) return;
        const separatorIndex = trimmed.includes(':') ? trimmed.indexOf(':') : trimmed.indexOf('=');
        if (separatorIndex <= 0) return;
        const key = trimmed.slice(0, separatorIndex).trim().toLowerCase().replace(/\s+/g, '_');
        const value = trimmed.slice(separatorIndex + 1).trim();
        if (key) kv[key] = value;
      });
      const canonicalFromKv = buildCanonical(kv);
      if (canonicalFromKv) {
        console.log('[QR_PARSE] ✅ Key=value parseado com sucesso');
        return canonicalFromKv;
      }
    }

    // 3.1) key=value / key:value em linha única (separado por ; | ou quebra)
    if (/[:=]/.test(text)) {
      console.log('[QR_PARSE] 🔍 Tentando formato key=value inline...');
      const kv = {};
      const chunks = text.split(/[;|\n\r]+/).map(s => String(s || '').trim()).filter(Boolean);
      chunks.forEach((chunk) => {
        const idxColon = chunk.indexOf(':');
        const idxEq = chunk.indexOf('=');
        const sep = (idxColon >= 0 && idxEq >= 0) ? Math.min(idxColon, idxEq) : Math.max(idxColon, idxEq);
        if (sep <= 0) return;
        const rawKey = chunk.slice(0, sep).trim();
        const rawValue = chunk.slice(sep + 1).trim();
        if (!rawKey || !rawValue) return;
        kv[rawKey] = rawValue;
      });

      const canonicalFromInlineKv = buildCanonical(kv);
      if (canonicalFromInlineKv) {
        console.log('[QR_PARSE] ✅ Key=value inline parseado com sucesso');
        return canonicalFromInlineKv;
      }
    }

    // 4) formato posicional legado
    console.log('[QR_PARSE] 🔍 Tentando formato posicional legado...');
    const bySemicolon = text.split(';').map(p => p.trim()).filter(Boolean);
    const byPipe = text.split('|').map(p => p.trim()).filter(Boolean);
    const byLine = text.split(/\r?\n/).map(p => p.trim()).filter(Boolean);

    let parts = bySemicolon;
    if (parts.length < 12 && byPipe.length >= 8) parts = byPipe;
    if (parts.length < 12 && byLine.length >= 8) parts = byLine;
    if (parts.length < 8) {
      console.error('[QR_PARSE] ❌ Nenhum formato reconhecido. Partes detectadas:', {
        semicolon: bySemicolon.length,
        pipe: byPipe.length,
        lines: byLine.length
      });
      return null;
    }

    const comp = parts.slice(11).join(' ').trim();

    const result = {
      supplier_id: parts[0] || '',
      supplier_name: parts[1] || '',
      nf: parts[2] || '',
      product_id: parts[3] || '',
      lot: parts[4] || '',
      sup_product_id: parts[5] || '',
      color_id: parts[6] || '',
      fabric_pattern: parts[7] || '',
      loc: parts[8] || '',
      meters_supplier: numberFrom(parts[9]),
      wid: numberFrom(parts[10]),
      comp: comp || ''
    };
    
    console.log('[QR_PARSE] ✅ Formato posicional parseado com sucesso:', result);
    return result;
  },

  applyQrDataToForm(data){
    console.log('[UI_STATE] 📝 Aplicando QR payload ao formulário:', data);
    
    if (!data || typeof data !== 'object') {
      console.error('[UI_STATE] ❌ Dados QR inválidos para aplicar ao formulário');
      return;
    }

    // Campos que serão preenchidos e seu mapeamento
    const mapping = {
      supplier_id: 'supplier_id',
      supplier_name: 'supplier_nm',
      supplier_nm: 'supplier_nm',
      nf: 'nf',
      product_id: 'product_id',
      lot: 'lot',
      sup_product_id: 'sup_product_id',
      color_id: 'color_id',
      fabric_pattern: 'fabric_pattern',
      loc: 'loc',
      wid: 'wid',
      len: 'len',
      comp: 'comp'
    };

    let preenchidos = 0;

    // Aplicar campos mapeados
    Object.entries(mapping).forEach(([qrField, formFieldId]) => {
      if (!data.hasOwnProperty(qrField)) return;
      
      const el = UI.getEl(formFieldId);
      if (!el) {
        console.warn(`[UI_STATE] ⚠️ Campo ${formFieldId} não encontrado no DOM`);
        return;
      }

      const value = String(data[qrField] || '').trim();
      if (value === '' || value === '0') {
        console.log(`[UI_STATE] ⏭️ Campo ${formFieldId} vazio, pulando`);
        return;
      }

      try {
        el.value = value;
        el.setAttribute('data-prefilled', 'true');
        console.log(`[UI_STATE] ✅ ${formFieldId} = "${value.substring(0, 30)}${value.length > 30 ? '...' : ''}"`);
        preenchidos++;
      } catch (e) {
        console.error(`[UI_STATE] ❌ Erro ao preencher ${formFieldId}:`, e);
      }
    });

    // Tratamento especial para metros_supplier → priority: meters_supplier > wid
    if (data.meters_supplier != null && data.meters_supplier !== 0 && data.meters_supplier !== '') {
      const metersEl = UI.getEl('meters_supplier');
      if (metersEl) {
        const v = String(data.meters_supplier).trim();
        if (v !== '' && v !== '0') {
          try {
            metersEl.value = v;
            metersEl.setAttribute('data-prefilled', 'true');
            console.log(`[UI_STATE] ✅ meters_supplier = "${v}"`);
            preenchidos++;
          } catch (e) {
            console.error('[UI_STATE] ❌ Erro ao preencher meters_supplier:', e);
          }
        }
      } else {
        // Fallback: se não existe meters_supplier, tenta usar wid como storage alternativo
        const widEl = UI.getEl('wid');
        if (widEl && !String(widEl.value || '').trim()) {
          const v = String(data.meters_supplier).trim();
          if (v !== '' && v !== '0') {
            try {
              widEl.value = v;
              widEl.setAttribute('data-prefilled', 'true');
              console.log(`[UI_STATE] ⚠️ meters_supplier → wid (fallback) = "${v}"`);
              preenchidos++;
            } catch (e) {
              console.error('[UI_STATE] ❌ Erro ao preencher wid (fallback):', e);
            }
          }
        }
      }
    }

    console.log(`[UI_STATE] 📊 Resultado: ${preenchidos} campos preenchidos`);

    // Esconder overlay de início assim que o QR for aplicado
    const startOverlay = UI.getEl('startOverlay');
    if (startOverlay) { 
      startOverlay.style.display = 'none'; 
      console.log('[UI_STATE] ✅ startOverlay ocultado'); 
    }
  },

  lockPrefilledFields(){
    [
      'supplier_id',
      'supplier_nm',
      'nf',
      'product_id',
      'lot',
      'sup_product_id',
      'color_id',
      'fabric_pattern',
      'loc',
      'wid',
      'len',
      'comp',
      'est_tc'
    ].forEach(id=>{
      const el = UI.getEl(id);
      if (!el) return;

      if (el.getAttribute('data-prefilled') === 'true') {
        const value = String(el.value || '').trim();
        if (value !== '') {
          // Campos preenchidos pelo QR agora permanecem editáveis
          // para corrigir inconsistências dos dados do TOTVS MODA
          el.readOnly = false;
          el.disabled = false;
          el.classList.add('prefilled'); // mantém indicação visual de que veio do QR
        } else {
          // Se veio vazio pelo QR, libera edição
          el.readOnly = false;
          el.disabled = false;
          el.classList.remove('prefilled');
          el.removeAttribute('data-prefilled');
        }
      }
    });
  },

  /**
   * =========================================================================
   * MÉTODO: handleQrScanResult
   * =========================================================================
   * Processa dados de QR lido via callback global.
   * Complementa o fluxo async de scanQrFromCamera().
   */
  async handleQrScanResult(qrData){
    console.log('[QR_CALLBACK] 📲 handleQrScanResult recebeu dados:', qrData.substring(0, 50) + '...');
    
    try {
      // Validação básica
      if (!qrData || typeof qrData !== 'string') {
        console.error('[QR_CALLBACK] ❌ Dados inválidos recebidos');
        UI.showToast('Erro: Dados de QR inválidos', '#ef4444');
        return;
      }

      // Se já existe uma revisão ativa, não processa
      if (review_id) {
        console.warn('[QR_CALLBACK] ⚠️ Já existe revisão ativa');
        UI.showToast('Já existe uma revisão em andamento', '#f59e0b');
        return;
      }

      // Parse do QR
      const parsedData = this.parseQrPayload(qrData);
      if (parsedData) {
        console.log('[QR_CALLBACK] ✅ QR parseado com sucesso');
        // Aplica dados ao formulário
        this.applyQrDataToForm(parsedData);
        this.lockPrefilledFields();
        UI.showToast('✅ QR lido e campos preenchidos', '#10b981');
      } else {
        console.warn('[QR_CALLBACK] ⚠️ QR lido mas sem mapeamento completo');
        UI.showToast('QR lido. Complete os campos não reconhecidos.', '#f59e0b');
      }
    } catch (error) {
      console.error('[QR_CALLBACK] 💥 Erro ao processar QR:', error);
      UI.showToast('Erro ao processar QR: ' + error.message, '#ef4444');
    }
  }
};

function handleManualEntryMode(){
  console.log('[MANUAL_ENTRY] 🚀 Iniciando modo de entrada manual');
  
  try {
    // Verificar se já existe uma revisão em andamento
    if (review_id) {

      return;
    }

    const payload = { revisorNome: selectedRevisor, qrData: null };
    console.log('[MANUAL_ENTRY] 🔄 Chamando initializeRRT em modo manual:', payload);

    // No modo manual não há QR/rolo físico para bloquear a abertura da revisão.
    App.initializeRRT(payload).then(() => {
      console.log('[MANUAL_ENTRY] 🎉 Modo manual iniciado com sucesso');
      UI.showToast('Modo manual ativado. Preencha os dados do formulário.', '#22c55e');

    }).catch(error => {
      console.error('[MANUAL_ENTRY] 💥 ERRO ao iniciar modo manual:', error);
      console.error('[MANUAL_ENTRY] 📋 Stack trace:', error.stack);
      UI.showToast('Erro ao iniciar modo manual: ' + error.message, '#ef4444');
    });

  } catch (error) {
    console.error('[MANUAL_ENTRY] 💥 ERRO no handleManualEntryMode:', error);
    UI.showToast('Erro ao iniciar modo manual: ' + error.message, '#ef4444');
  }
}

const THEME_KEY='themePreference';

// =========================================================================
// 12. DOM READY (ALINHADO COM ReviewState)
// =========================================================================
document.addEventListener('DOMContentLoaded', () => {
  // ✅ OTIMIZADO: Inicializar cache de elementos primeiro
  ElementCache.init();
  
  if (typeof loadTheme === 'function') { loadTheme(); }

  // -----------------------------------------------------------------------
  // 1. Garantir referência principal sem clonar DOM (mais leve em mobile)
  // -----------------------------------------------------------------------
  if (!document.getElementById('mainForm')) {
    try {
      const wrap =
        document.querySelector('.wrap[role="main"]') ||
        document.querySelector('.wrap');

      if (wrap) {
        wrap.id = 'mainForm';
      }
    } catch (err) {
      console.error('[FORM] MAIN_FORM_CREATE_ERROR |', err);
    }
  }

  // -----------------------------------------------------------------------
  // 2. Inicialização principal da aplicação
  // -----------------------------------------------------------------------
  if (typeof App !== 'undefined' && App.init) {
    App.init();
  } else {
    console.warn('[APP] App.init não encontrado');
  }

  // -----------------------------------------------------------------------
  // 3. Consolidação segura do DefectManager
  // -----------------------------------------------------------------------
  if (typeof window.DefectManager !== 'undefined') {
    // ✅ OTIMIZADO: Inicializar observer global para imagens
    DefectManager.initImageObserver();
    
    DefectManager.getTotalPoints = function () {
      if (typeof State === 'undefined' || !Array.isArray(State.defects)) {
        return 0;
      }

      return State.defects.reduce((acc, d) => {
        const p = parseInt(d.gravidade);
        return acc + (isNaN(p) ? 0 : p);
      }, 0);
    };
  } else {
    console.warn('[DEFECT] DefectManager não encontrado');
  }

  // -----------------------------------------------------------------------
  // 4. Fallback seguro de Timer (telemetria)
  // -----------------------------------------------------------------------
  if (typeof window.Timer === 'undefined') {
    window.Timer = {
      getEventLogs: () => [
        {
          event: 'LOG_SISTEMA',
          timestamp: new Date().toISOString(),
          msg: 'Timer nativo não detectado, usando log de fallback'
        }
      ]
    };
  }

  // -----------------------------------------------------------------------
  // 5. Estado inicial da UI (SEM alterar estado lógico)
  // -----------------------------------------------------------------------
  UI.updateTimerDisplay(ReviewState.tempo_total_seg);
  UI.togglePauseButton(false);

  // -----------------------------------------------------------------------
  // 6. Event listener para mudança no tipo de tecido
  // -----------------------------------------------------------------------
  const est_tc = UI.getEl('est_tc');
  if (est_tc) {
    est_tc.addEventListener('change', updateMeasureFieldsByFabricType);
    updateMeasureFieldsByFabricType();
  }

  console.log('[SISTEMA] ✅ DOM pronto e alinhado com ReviewState');
});

function onPauseResumeClick() {
  console.log('[DEBUG_PAUSE] onPauseResumeClick chamado');
  console.log('[DEBUG_PAUSE] ReviewState.timer_state atual:', ReviewState.timer_state);
  
  if (ReviewState.timer_state === TIMER_STATE.RUNNING) {
    console.log('[DEBUG_PAUSE]  Pausando timer...');
    pauseReviewTimer();
    UI.togglePauseButton(true);
    UI.showToast('Revisão pausada', '#f59e0b');
  } else if (ReviewState.timer_state === TIMER_STATE.PAUSED) {
    console.log('[DEBUG_PAUSE] ▶️ Retomando timer...');
    resumeReviewTimer();
    UI.togglePauseButton(false);
    UI.showToast('Revisão retomada');
  } else {
    console.warn('[DEBUG_PAUSE] ⚠️ Estado do timer inesperado:', ReviewState.timer_state);
  }
  
  console.log('[DEBUG_PAUSE] ReviewState.timer_state após ação:', ReviewState.timer_state);
}

// =========================================================================
// 11.5. GESTÃO DE TIPO DE TECIDO (PLANO VS MALHA)
// =========================================================================
function updateMeasureFieldsByFabricType() {
  const est_tc = UI.getEl('est_tc');
  const wid_label = UI.getEl('wid_label');
  const wid_input = UI.getEl('wid');
  const supplier_weight_container = UI.getEl('supplier_weight')?.parentElement;
  
  if (!est_tc || !wid_label || !wid_input) return;
  
  const isMalha = est_tc.value === 'tc_malha';
  
  // Ajustar label do campo wid
  if (isMalha) {
    wid_label.textContent = 'Peso (Fornecedor) kg *';
    wid_input.setAttribute('step', '0.01');
    wid_input.setAttribute('placeholder', 'Ex: 15.50');
    
    // Esconder campo de peso separado (já estamos usando wid para peso)
    if (supplier_weight_container) {
      supplier_weight_container.style.display = 'none';
    }
  } else {
    // Tecido plano
    wid_label.textContent = 'Metros (Fornecedor) *';
    wid_input.setAttribute('step', '0.01');
    wid_input.setAttribute('placeholder', 'Ex: 150.00');
    
    // Mostrar campo de peso separado (opcional para tecidos planos)
    if (supplier_weight_container) {
      supplier_weight_container.style.display = 'block';
    }
  }
  
  console.log('[TECIDO] Tipo:', isMalha ? 'Malha' : 'Plano', '| Campo ajustado para:', wid_label.textContent);
}

// Initialize Service Worker (disabled for Apps Script host)
const isAppsScriptHost = location.hostname.includes('script.googleusercontent.com') || location.hostname.includes('script.google.com');
if (!isAppsScriptHost && 'serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('/service-worker.js', {
        scope: '/'
      });
      console.log('[OFFLINE] ✅ Service Worker registered:', registration);
    } catch (error) {
      console.warn('[OFFLINE] ⚠️ Service Worker registration failed:', error);
    }
  });

  // Message handler from Service Worker
  navigator.serviceWorker.addEventListener('message', (event) => {
    const { type, data } = event.data;
    if (type === 'SYNC_COMPLETE') {
      console.log('[OFFLINE] ✅ Sync completed:', data.count, 'items');
      showToast(`✅ ${data.count} item(ns) sincronizado(s) com sucesso`);
    }
  });
} else if (isAppsScriptHost) {
  console.warn('[OFFLINE] ⚠️ Service Worker desabilitado no host Apps Script');
} else {
  console.warn('[OFFLINE] ⚠️ Service Workers not supported');
}

// Update offline status indicator
function updateOfflineStatus() {
  const offlineStatus = document.getElementById('offline-status');
  const isOnline = navigator.onLine;
  
  if (!offlineStatus) return;
  
  if (!isOnline && window.OfflineManager) {
    offlineStatus.style.display = 'flex';
    const queueLength = window.OfflineManager.getQueueLength?.() || 0;
    const queueElement = document.getElementById('offline-queue-count');
    if (queueElement) {
      queueElement.textContent = `${queueLength} itens na fila`;
    }
  } else {
    offlineStatus.style.display = 'none';
  }
}

// Listen for online/offline events
window.addEventListener('online', () => {
  console.log('[OFFLINE] 🟢 Back online');
  updateOfflineStatus();
  
  // Trigger sync
  if (window.OfflineManager) {
    window.OfflineManager.syncQueue();
  }
});

window.addEventListener('offline', () => {
  console.log('[OFFLINE] 🔴 Went offline');
  updateOfflineStatus();
  showToast('📡 Você está offline. Os dados serão sincronizados automaticamente quando reconectar.');
});

// Check status on page load
window.addEventListener('load', updateOfflineStatus);
